# 提交信息拦截（CI 层）— WXG-T-016
# 只查「新增」提交：PR 查 base..HEAD，push 到 master/develop 查推送区间（基点缺失时回退只查 HEAD）
# ——不回溯历史（历史提交可能不符合新规，属已知豁免；本地拦截层见 .githooks/commit-msg）
# 规则文档：docs/ci/commit-and-review-rules.md
name: Commit Lint

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: commit-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # 注意：required check 名匹配的是 job 名（此处即 "lint"）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # commitlint.config.mjs extends @commitlint/config-conventional，
      # 配置解析需要本地依赖，必须先 install（不能裸 npx 拉缓存）
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits (base..HEAD)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=HEAD

      - name: Lint pushed commits (push to master/develop)
        if: github.event_name == 'push'
        run: |
          set -u
          BEFORE="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          # 首推 / 强推 / 基点不可达 → 回退为只 lint HEAD，避免因基点缺失直接红
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "无法定位推送前基点（首推/强推），回退为只 lint HEAD"
            git log -1 --pretty=%B | npx commitlint
            exit 0
          fi
          # **squash 同步提交例外**（WXG-T-179，2026-09-20）：`develop → master` 用 squash 时，
          # GitHub 会把被折叠的各提交主题以 `* ` 前缀拼进同一条消息⇒ 一颗 99 字符的合规标题
          # 会变成 101 字符的 footer 行，触 `footer-max-line-length` 把 master 跑红。
          # 这些子提交在进 develop 时已被逐条 lint 过 ⇒ 折叠件**只校标题行**（type/scope/长度/task-id 照校）。
          # 识别依据：正文含以 `* <type>(<scope>): ` 开头的折叠主题行（普通提交不会这么写）。
          MSG="$(git log -1 --pretty=%B "$HEAD_SHA")"
          if printf '%s\n' "$MSG" | grep -qE '\* [a-z]+(\([a-z-]+\))?: '; then
            echo "HEAD 是 squash 折叠出的同步提交 ⇒ 只校标题行（子提交已在 develop 阶段逐条 lint）"
            printf '%s\n' "$MSG" | head -n 1 | npx commitlint
          else
            echo "lint 推送区间 ${BEFORE}..${HEAD_SHA}"
            npx commitlint --from="$BEFORE" --to="$HEAD_SHA"
          fi
