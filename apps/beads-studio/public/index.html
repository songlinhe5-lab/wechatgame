<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>beads-studio · 照片转拼豆</title>
    <style>
        :root {
            --bd: #d8d2c4;
            --bg: #faf7f0;
            --ac: #3d7bf5;
            --tx: #33333d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--tx);
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 12px;
            align-items: baseline;
            /* 结果区有上万像素高：入口吸顶，滚到任何位置都能回管理页。 */
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
        }

        h1 {
            font-size: 16px;
            margin: 0;
        }

        main {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr) 320px;
            gap: 16px;
            padding: 16px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 列位写死，不靠自动流：关卡条通栏占首行，表单 = 左列，豆面 = 中列，已存结果 = 最右列。
           （不写死会按自动流把表单挤到中列、豆面挤到左下，2026-10-24 实测布局错位。） */
        #lvbar { grid-column: 1 / -1; }
        main > section:first-of-type { grid-column: 1; }
        main > section:last-of-type { grid-column: 2; }
        #results { grid-column: 3; }
        /* 最右列只有 320px：id 单行省略、属性单行不折，344 条也保持紧凑（否则每条折成两行锯齿） */
        #results .item { gap: 6px; }
        #results .item span { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #results .item small { flex: 0 0 auto; white-space: nowrap; }
        #results .item .del { flex: 0 0 28px; }

        @media (max-width:1180px) {
            main {
                grid-template-columns: 340px minmax(0, 1fr);
            }

            #results { grid-column: 2; }        /* 中屏收回右列（豆面下方） */
        }

        @media (max-width:860px) {
            main {
                grid-template-columns: 1fr;
            }

            #lvbar,
            main > section:first-of-type,
            main > section:last-of-type,
            #results {
                grid-column: 1;
            }
        }

        .card {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 14px;
        }

        label {
            display: block;
            margin: 8px 0 2px;
            font-size: 12px;
            color: #666;
        }

        input,
        select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            font: inherit;
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: var(--ac);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        button.ghost {
            background: #eee;
            color: var(--tx);
            margin-top: 6px;
        }

        canvas {
            width: 100%;
            image-rendering: pixelated;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: #fff;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .tabs button {
            margin: 0;
            padding: 5px 10px;
            width: auto;
            background: #eee;
            color: var(--tx);
            font-weight: 400;
            border-radius: 6px;
        }

        .tabs button.on {
            background: var(--ac);
            color: #fff;
        }

        #stats {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            white-space: pre-line;
        }

        .bad {
            font-size: 12px;
            color: #c0392b;
            white-space: pre-line;
        }

        .bad:empty {
            display: none;
        }

        #results .grp {
            margin-top: 12px;
        }

        #results h3 {
            font-size: 13px;
            margin: 6px 0;
            color: #666;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .item:hover {
            border-color: var(--ac);
        }

        /* 刚存下的那条：高亮 + 浅底，免得用户在一长列 id 里找不到以为没保存成功（2026-10-24 实测反馈） */
        .item.on {
            border-color: var(--ac);
            background: #eef2fe;
            font-weight: 600;
        }

        .item small {
            color: #999;
        }

        .item .del {
            margin: 0;
            width: 28px;
            height: 28px;
            padding: 0;
            background: transparent;
            color: #999;
            border-radius: 6px;
            font-size: 15px;
        }

        .item .del:hover {
            background: #c0392b;
            color: #fff;
        }

        #msg {
            margin-top: 8px;
            font-size: 12px;
            min-height: 18px;
        }

        .err {
            color: #c0392b;
        }

        .ok {
            color: #1e8e3e;
        }
    </style>
    <!-- [WXG-T-221] 预烘前端需 import harness 编译产物（bare `@wxgame/framework` 由 studio server
         的 /harness-dist/* 只读映射供）。依赖 `pnpm run harness:build` 产出 dev/harness/dist/。 -->
    <script type="importmap">
        {
            "imports": {
                "@wxgame/framework": "/harness-dist/packages/framework/src/index.js",
                "@wxgame/framework/": "/harness-dist/packages/framework/src/"
            }
        }
    </script>
</head>

<body>
    <header>
        <h1>beads-studio</h1><span style="color:#999;font-size:12px">照片 → 拼豆关卡草案（WXG-T-179）· 生成核心 beads-gen.mjs</span>
        <a href="/manage.html" style="margin-left:auto;font-size:12px;color:var(--ac);text-decoration:none">大关/小关管理 →</a>
        <a href="/tint.html" style="font-size:12px;color:var(--ac);text-decoration:none">豆面 tint 编辑器 →</a>
    </header>
    <main>
        <!-- [?level=<uid>] 从大关管理页带关进来时的关卡条（载入该关图案 / 生成后一键替换回该关） -->
        <div class="card" id="lvbar" hidden></div>
        <section class="card">
            <label>源图（本地解像，不上传原图）</label>
            <input type="file" id="file" accept="image/*">
            <label>盘面档位（标准 standard29；选图自动测格切自定义）</label>
            <select id="board">
                <option value="standard29" selected>standard29 · 29×29（业界默认标准方盘；豆径看下方品牌）</option>
                <option value="small18">small18 · 18×18</option>
                <option value="small14">small14 · 14×14</option>
                <option value="small16">small16 · 16×16</option>
                <option value="custom">自定义…</option>
            </select>
            <label>单珠尺寸倍率 1x/2x/3x/4x（2x ⇒ 行列÷2、珠数≈÷4；选后即时重推）</label>
            <select id="density">
                <option value="1">1x（按品牌标准）</option>
                <option value="2" selected>2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
            </select>
            <div class="row2" id="customSize" style="display:none">
                <div><label>列</label><input type="number" id="cols" value="29" min="2" max="107"></div>
                <div><label>行</label><input type="number" id="rows" value="29" min="2" max="107"></div>
            </div>
            <div class="row2">
                <div><label>候选色集合（量化目标色）</label><select id="palette">
                        <!-- 选项由 /brands.json 生成（品牌↔mm↔dip 单一真源，ADR-0021）；本文件不再手写品牌与 mm -->
                    </select></div>
                <div><label>实际用几种颜色<span id="colorsHint">（参考图，不可入关）</span></label><input type="number" id="colors"
                        value="8" min="3" max="35"></div>
            </div>
            <div class="row2">
                <div><label>错位密度</label><select id="misKind">
                        <option value="none">不错位（实物图纸 · 最像原图）</option>
                        <option value="full" selected>全错位（每颗可填珠都不就位）</option>
                        <option value="max">最大化错位（色少也能尽量错开）</option>
                        <option value="swaps">少量交换（k 对 ⇒ 仅 2k 颗错位）</option>
                    </select></div>
                <div id="swapsBox" style="display:none"><label>交换对数 k（1–8）</label><input type="number" id="swaps"
                        value="8" min="1" max="8"></div>
                <div><label>众数滤波轮数（0 = 关，保细节；大块风可 1–2）</label><input type="number" id="smooth" value="0" min="0"
                        max="5"></div>
                <div><label>源图中值滤波（量化前，消除 JPEG 伪影）</label><select id="premedian">
                        <option value="0" selected>关</option>
                        <option value="3">3×3（推荐照片）</option>
                        <option value="5">5×5（低质压缩图）</option>
                    </select></div>
            </div>
            <div class="row2">
                <div><label>盘面形状</label><select id="shapeKind">
                        <option value="rect" selected>长方形</option>
                        <option value="free">非长方形</option>
                    </select></div>
                <div id="freeShapeBox" style="display:none"><label>非长方形轮廓</label><select id="freeShape">
                        <option value="circle" selected>圆形</option>
                        <option value="hex">六边形</option>
                        <option value="heart">心形</option>
                    </select></div>
                <div><label>选色模式（限色时挑哪几种）</label><select id="colorsmode">
                        <option value="error" selected>误差最小·保形（推荐）</option>
                        <option value="freq">频次优先·保大块</option>
                    </select></div>
                <div><label>格级风格</label><select id="cellmode">
                        <option value="mode" selected>主导色·卡通干净</option>
                        <option value="avg">平均色·照片纹理</option>
                    </select></div>
            </div>
            <!-- EP12-S9（裁定②）：风格 = 拼豆台皮肤，随 levelDraft.skin 导出（引用 id，不传数据本体）。
                 选项与白名单同源 = server.mjs SKIN_IDS ⇔ games/beads/src/config/skins/registry.ts 注册表。 -->
            <div class="row2">
                <div><label>风格（拼豆台皮肤，随关卡导出）</label><select id="skin">
                        <option value="warm-paper" selected>暖纸拼豆台（默认）</option>
                        <option value="cool-violet">冷紫灰</option>
                    </select></div>
            </div>
            <label style="margin-top:10px"><input type="checkbox" id="noframe" style="width:auto">
                铺满整盘（不扣背景；仅游戏关卡盘用——**实物图纸还原务必保持不勾**，否则背景吃掉大半用色预算）</label>
            <!-- [?level=<uid>] 关卡模式专属：勾上 = 尺寸/盘位档强制对齐该关 + 关 beads-gen 的包围盒裁剪，
                 空边保留为 void ⇒ 生成结果实际盘面 = 该关盘面，替换回该关不改尺寸。
                 ⚠ 隐藏靠 style.display（本页 label{display:block} 会压过 [hidden] 的 UA 样式）。 -->
            <label id="exactWrap" style="margin-top:10px;display:none"><input type="checkbox" id="exactSize" style="width:auto">
                按该关尺寸生成（自动关 trim：空边保留为空洞，盘面尺寸不变）</label>
            <button id="gen">生成预览（不入历史）</button>
            <!-- 生成只刷效果（写单一草稿位），此按钮才把这条预览转正进「已存结果」 -->
            <button id="commit" class="ghost" disabled style="margin-top:6px">✓ 确认保存这条结果</button>
            <div id="msg"></div>
        </section>
        <section>
            <div class="card">
                <canvas id="cv" width="420" height="420" style="width:420px"></canvas>
                <div class="tabs">
                    <button id="tSrc">原图</button>
                    <button id="tSolved" class="on">正解图</button>
                    <button id="tMis">错位图（初始盘）</button>
                </div>
                <div id="badge" class="bad"></div>
                <div id="stats"></div>
                <button class="ghost" id="dl" disabled>下载 levelDraft JSON</button>
                <button class="ghost" id="cp" disabled>复制 rowstrings</button>
                <!-- 入关入口只在管理页（2026-10-24 用户裁定）：本页不再有「导入大关」，避免两处各长一套 -->
                <button class="ghost" id="bake" disabled title="先选中一条结果">烘焙本关纹理</button>
                <div id="bake-status" style="font-size:12px;color:#666;margin-top:4px;min-height:16px"></div>
                <!-- [WXG-T-222] tint 资源导出（色无关 mask/base 四件套；有孔/无孔切换）+ 实时预览 -->
                <div style="margin-top:8px;padding-top:8px;border-top:1px solid #eee">
                    <label style="font-size:12px;color:#666">tint 档位
                        <select id="tint-mode" style="margin:0 6px">
                            <option value="holed">有孔（四向刻面）</option>
                            <option value="holeless">无孔（四向刻面）</option>
                        </select>
                    </label>
                    <label style="font-size:12px;color:#666;margin-left:6px">tint 色
                        <input type="color" id="tint-color" value="#d9534f" style="vertical-align:middle;margin-left:4px">
                    </label>
                    <button class="ghost" id="tint-export">导出 tint 资源（4 纹理）</button>
                    <div id="tint-status" style="font-size:12px;color:#666;margin-top:4px;min-height:16px"></div>
                    <div style="display:flex;gap:8px;margin-top:6px">
                        <div style="text-align:center">
                            <canvas id="tint-cv-bead" width="128" height="128" style="width:160px;height:160px;image-rendering:pixelated;background:#232830;border-radius:4px"></canvas>
                            <div style="font-size:11px;color:#888">珠</div>
                        </div>
                        <div style="text-align:center">
                            <canvas id="tint-cv-grid" width="128" height="128" style="width:160px;height:160px;image-rendering:pixelated;background:#232830;border-radius:4px"></canvas>
                            <div style="font-size:11px;color:#888">格</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- 已存结果：独立成最右一列（窄屏回落右列下方 / 单列） -->
        <div class="card" id="results"><b>已存结果</b> <small>（GET /api/results，小游戏在线导入同源）</small></div>
    </main>
    <!-- 盘面绘制共享模块（视觉正源 = games/beads/src/view/{palette,bead-render}.ts，见文件头同步表） -->
    <script src="/board-render.js"></script>
    <!-- [WXG-T-221] 当前关纹理预烘导出（ES module，依赖上方 importmap + harness dist） -->
    <script type="module" src="/bake-export.js"></script>
    <script type="module" src="/tint-export.js"></script>
    <script>
        'use strict';
        const $ = (id) => document.getElementById(id);
        let current = null; // 当前 result.json
        let lastBoardRows = null; // 最近一次画到盘面的 rowsArr（tint 档位变化时重绘用，WXG-T-222）
        let srcPixels = null; // {w,h,data:Uint8ClampedArray} —— 送服务端的解像结果
        let srcThumb = null;  // 原图缩略图 dataURL（选图即生，随 POST 存盘 ⇒ 历史条目也能看）
        let srcUrl = null;    // 原文件 objectURL（src 视图预览用：448 缩略图放大必糊，2026-09-21）
        let view = 'solved';

        const THUMB_MAX = 448; // ≈ 预览画布宽，原图视图够用且存盘体积可控

        /** Uint8ClampedArray → base64（分块，避免 fromCharCode 参数上限）。 */
        function toB64(u8) {
            let s = '';
            for (let i = 0; i < u8.length; i += 0x8000) {
                s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
            }
            return btoa(s);
        }

        /** 盘面形状：只区分「长方形 / 非长方形」；非长方形再选具体轮廓（铺满由 beads-gen 保证）。 */
        const shapeValue = () => ($('shapeKind').value === 'rect' ? 'square' : $('freeShape').value);
        $('shapeKind').onchange = () => {
            $('freeShapeBox').style.display = $('shapeKind').value === 'free' ? 'block' : 'none';
        };

        /** 用色域联动（v1.40 品牌引用制）：全部为品牌色板，3–35 参考图；入关不限色板
         *  —— 关卡写回 slug+色号，游戏侧从品牌注册表查 hex 渲染。 */
        function syncColorsDomain() {
            $('colors').min = 3; $('colors').max = 35;
            $('colorsHint').textContent = '（参考图，可入关：写回品牌色号）';
        }
        $('palette').onchange = () => { syncColorsDomain(); refreshInfer(); };
        $('density').onchange = () => refreshInfer();   // 切倍率即时按当前品牌/照片重推行列
        syncColorsDomain();

        /**
         * 品牌表（「候选色系宏」的 studio 侧产物）：/brands.json 与游戏侧 BRANDS **同批
         * 同函数生成**（真源 = games/beads/art/<slug>.json 的 name/family/beadMm +
         * sync-palettes.mjs 的唯一 dip(mm)；ADR-0021）。本文件**不再有任何 mm / dip 硬表**：
         * 下拉标签、每颗标准像素、成品尺寸换算均取自 BRANDS。
         */
        let BRANDS = {}; // slug → { slug, name, family, mm, dip, colors, pending? }
        const brandsReady = fetch('/brands.json')
            .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
            .then((j) => {
                const sel = $('palette');
                const groups = {};
                for (const b of j.brands) {
                    BRANDS[b.slug] = b;
                    let g = groups[b.family];
                    if (!g) {
                        g = groups[b.family] = document.createElement('optgroup');
                        g.label = b.family;
                        sel.appendChild(g);
                    }
                    const o = document.createElement('option');
                    o.value = b.slug;
                    // mm 在此仅作**展示**（唯一数值源仍是 brands.json 的 b.mm）
                    o.textContent = `${b.name} · ${b.mm}mm · ${b.colors} 色${b.pending ? '（敬请期待）' : ''}`;
                    o.disabled = !!b.pending;
                    g.appendChild(o);
                }
                if (BRANDS['artkal-s']) sel.value = 'artkal-s'; // 默认档保持（旧 HTML 的 selected）
                syncColorsDomain();
            })
            .catch((e) => msg(`品牌表 /brands.json 加载失败（${e.message}）：请跑 \`pnpm run palettes:sync\` 后刷新`, 'err'));
        /** 当前选中品牌的条目；未就绪 / 未知 slug → null。**不回落默认 5mm**——静默默认就是第二套真源。 */
        const currentBrand = () => BRANDS[$('palette').value] || null;

        /** 已解像源图的边长与「源图已解像…」提示前缀：换品牌时按新 dip 重推格数并用。 */
        let srcDims = null;
        let srcMsgBase = '';

        /**
         * 格数推断（**每颗像素标准 = 选中品牌的 dip**，真源见 BRANDS / ADR-0021；
         * `levels-spec §3.1` 的「每颗 32px」= 5mm 品牌的特例，2.6mm ⇒ 16px、同图格数翻倍）。
         * 优先级：
         *   1. 正方形 + 边长是 PER_BEAD_PX 的整数倍（允许 ±2px 浮动）→ 标准设计图，直接按每颗 dip 推断
         *   2. 珠距检测可信（gx≥15）→ 实拍物理盘照片
         *   3. dip 推断在合法范围内 → 兜底
         * 推断上限取「解像上限 ÷ 每颗像素」而非单图上限：>SINGLE_MAX 不是非法盘面，而是走**组合图 Plate**
         *（`server.mjs ingestLevel` 自动均分切块）。`SINGLE_MAX` = §3.3 `GRID_MAX`（**v1.45：50→32**）。
         * 返回要拼在「源图已解像」后的注记串（可能为空）；副作用 = 回填 #board/#cols/#rows。
         */
        async function inferBoard(w, h) {
            await brandsReady;                 // 品牌表就绪（加载失败已在加载处报红 ⇒ 取不到就不推断，**不默默按 5mm 走**）
            const brand = currentBrand();
            if (!brand) return '｜⚠ 品牌表未就绪，未做格数推断（刷新页面；仍不存在则跑 `pnpm run palettes:sync`）';
            const mm = brand.mm;                        // 品牌物理珠径（成品尺寸用）
            const PER_BEAD_PX = brand.dip;              // 每颗标准 px（旧 DIP_BY_MM 硬表已删）
            const MAX_INFER = Math.floor(4096 / PER_BEAD_PX);        // 可推断范围（非单图上限）
            const SINGLE_MAX = 32;                                   // 单图宽高上限；任一维超过即拆组合图
            const sug = detectBeadGrid(srcPixels);
            const cPx = Math.round(w / PER_BEAD_PX), rPx = Math.round(h / PER_BEAD_PX);
            const isStdSquare = w === h
                && (w % PER_BEAD_PX <= 2 || w % PER_BEAD_PX >= PER_BEAD_PX - 2);
            const inferred = (cPx >= 2 && rPx >= 2 && cPx <= MAX_INFER && rPx <= MAX_INFER)
                ? { cols: cPx, rows: rPx, gx: Math.round(w / cPx), gy: Math.round(h / rPx) } : null;
            const sugOk = !!(sug && sug.gx >= 15 && sug.gy >= 15
                && sug.cols <= MAX_INFER && sug.rows <= MAX_INFER);
            const useSug = (isStdSquare && inferred) ? inferred : sugOk ? sug : inferred;
            if (!useSug) return '';
            const dens = Math.max(1, parseInt($('density').value, 10) || 1);   // 单珠尺寸倍率：N x ⇒ 行列 ÷N、珠数 ≈÷N²
            useSug.cols = Math.max(2, Math.round(useSug.cols / dens));
            useSug.rows = Math.max(2, Math.round(useSug.rows / dens));
            $('board').value = 'custom'; $('customSize').style.display = 'grid';
            $('cols').value = useSug.cols; $('rows').value = useSug.rows;
            const sizeNote = `成品 ${(useSug.cols * mm / 10).toFixed(1)}×${(useSug.rows * mm / 10).toFixed(1)} cm @${mm}mm 豆径`;
            const plateNote = (useSug.cols > SINGLE_MAX || useSug.rows > SINGLE_MAX)
                ? `｜超单图上限 ${SINGLE_MAX} ⇒ 一键入关自动拆成组合图 Plate（每宫 ≤${SINGLE_MAX}）` : '';
            return (!isStdSquare && sugOk)
                ? `｜珠距检测 ${useSug.gx}×${useSug.gy}px ⇒ 建议 ${useSug.cols}×${useSug.rows} 格（${sizeNote}，可手改）${plateNote}`
                : `｜标准 ${PER_BEAD_PX}px/颗（${brand.name} ${mm}mm）推断 ⇒ ${useSug.cols}×${useSug.rows} 格（${sizeNote}，可手改）${plateNote}`;
        }

        /** 选图后改品牌 ⇒ 立即按新 dip 重推（否则屏幕上留着旧品牌的格数与 cm，等于第二个真源的后果）。 */
        async function refreshInfer() {
            if (!srcDims) return;
            const note = await inferBoard(srcDims.w, srcDims.h);
            msg(srcMsgBase + note, note.startsWith('｜⚠') ? 'err' : 'ok');
        }

        /** 错位密度：全错位（引擎 misplaced 初盘，成片错豆）/ 最大化错位（同走 misplaced，
         *  但主导色过半时不拒产、只把错不开的强制就位）/ 少量交换（才需要 k）。 */
        $('misKind').onchange = () => {
            $('swapsBox').style.display = $('misKind').value === 'swaps' ? 'block' : 'none';
        };

        $('board').onchange = () => {
            const b = $('board').value;
            $('customSize').style.display = b === 'custom' ? 'grid' : 'none';
            const map = { small14: [14, 14], small18: [18, 18], small16: [16, 16], standard29: [29, 29] };
            if (map[b]) { $('cols').value = map[b][0]; $('rows').value = map[b][1]; }
        };

        $('file').onchange = async () => {
            const f = $('file').files[0];
            if (!f) return;
            const img = await createImageBitmap(f);
            // v1.5（2026-09-21 用户拍板）：不缩图——原始 px 尺寸是测格/豆数计算的输入，
            // 缩图会破坏珠距检测与成品尺寸换算。仅拦超限：body 上限 4096²（与服务端 MAX_BODY 对齐）。
            if (Math.max(img.width, img.height) > 4096) {
                msg(`原图 ${img.width}×${img.height} 超过 4096 解像上限，请先自行缩小后重选`, 'err');
                return;
            }
            const w = img.width, h = img.height;
            const cv = new OffscreenCanvas(w, h);
            const g = cv.getContext('2d', { willReadFrequently: true });
            g.drawImage(img, 0, 0, w, h);
            srcPixels = { w, h, data: g.getImageData(0, 0, w, h).data };
            srcDims = { w, h };
            // 原图缩略图（选图时本地生成，不依赖服务端返图）
            const tk = Math.min(1, THUMB_MAX / Math.max(img.width, img.height));
            const tw = Math.max(1, Math.round(img.width * tk)), th = Math.max(1, Math.round(img.height * tk));
            const tc = new OffscreenCanvas(tw, th);
            tc.getContext('2d').drawImage(img, 0, 0, tw, th);
            srcThumb = await blobToDataURL(await tc.convertToBlob({ type: 'image/jpeg', quality: 0.72 }));
            srcMsgBase = `源图已解像：${w}×${h}（RGBA ${Math.round(w * h * 4 / 1024)} KB）｜缩略图 ${tw}×${th}`;
            const sugNote = await inferBoard(w, h);
            // 品牌表拿不到 = 硬失败（不静默按某默认 mm 推断）⇒ 整条提红，不能混在“ok”里
            msg(srcMsgBase + sugNote, sugNote.startsWith('｜⚠') ? 'err' : 'ok');
            if (srcUrl) URL.revokeObjectURL(srcUrl);
            srcUrl = URL.createObjectURL(f); // 预览用原文件，缩略图只随 POST 存盘
            if (view === 'src') drawSrc(srcUrl); // 未生成时也能先看原图
        };

        /** 珠栅检测（WXG-T-179）：亮度对 |Δ| 平移自相关——平移量恰为真实珠距时，
         *  采样点与自身同珠对齐 ⇒ 平均差最小。横竖各自独立测；检测到即自动切自定义
         *  档位填入建议格数（可手改）。纯启发式：透视/局部/虚化图会测偏，用户可改。 */
        function detectBeadGrid(px) {
            const { w, h, data } = px;
            const lum = new Float32Array(w * h);
            for (let i = 0; i < w * h; i++) lum[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
            const diffAt = (dx, dy) => {
                let s = 0, n = 0;
                for (let y = dy; y < h; y += 3) {
                    for (let x = dx; x < w; x += 3) { s += Math.abs(lum[y * w + x] - lum[(y - dy) * w + x - dx]); n++; }
                }
                return n ? s / n : 255;
            };
            const bestPitch = (dx, dy, len) => {
                let bp = 0, bs = Infinity;
                for (let p = 8; p <= Math.min(100, len >> 2); p++) {
                    const s = diffAt(dx * p, dy * p);
                    if (s < bs) { bs = s; bp = p; }
                }
                // 半频抑制：2p₀ 也对齐（都打在同珠上），若 p₀/2 的分不比最低分差 8% 则取更细者
                if (bp >= 16) {
                    const hs = diffAt(dx * (bp >> 1), dy * (bp >> 1));
                    if (hs <= bs * 1.08) bp >>= 1;
                }
                return bp;
            };
            const gx = bestPitch(1, 0, w), gy = bestPitch(0, 1, h);
            if (!gx || !gy) return null;
            return { cols: Math.max(2, Math.round(w / gx)), rows: Math.max(2, Math.round(h / gy)), gx, gy };
        }

        // 自检：合成 8×8 均匀色块（12px 栅距）应检出 8×8；失败仅 console 警告，不打扰用户
        (function selfTestBeadGrid() {
            const P = 12, N = 8, w = P * N, h = P * N;
            const cell = [];
            let seed = 42;
            const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
            for (let i = 0; i < N * N; i++) cell.push(Math.floor(rnd() * 256));
            const data = new Uint8ClampedArray(w * h * 4);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const gv = cell[Math.floor(y / P) * N + Math.floor(x / P)], o = (y * w + x) * 4;
                data[o] = gv; data[o + 1] = (gv * 3) % 256; data[o + 2] = 255 - gv; data[o + 3] = 255;
            }
            const r = detectBeadGrid({ w, h, data });
            if (!r || r.cols !== N || r.rows !== N) console.warn('珠栅检测自检失败：', r);
        })();

        async function blobToDataURL(blob) {
            const buf = new Uint8Array(await blob.arrayBuffer());
            let s = '';
            for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
            return 'data:' + blob.type + ';base64,' + btoa(s);
        }

        function msg(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }

        $('gen').onclick = async () => {
            if (!srcPixels) return msg('先选源图', 'err');
            // 品牌表未就绪 ⇒ 拒生成：空 slug 会被 beads-gen 当“没传 --palette”而静默用默认品牌，
            // 等于绕过了单一真源（与上面“不默认 5mm”同一口径）。
            if (!currentBrand()) return msg('品牌表 /brands.json 未就绪：无法确定候选色集合与豆径 ⇒ 先跑 pnpm run palettes:sync 再刷新', 'err');
            const cols = parseInt($('cols').value, 10), rows = parseInt($('rows').value, 10);
            if (!cols || !rows) return msg('盘面尺寸非法', 'err');
            // 「按该关尺寸生成」（关卡模式专属）：尺寸 + 盘位档强制对齐该关，并让服务端关掉包围盒裁剪
            // （`notrim=1` ⇒ beads-gen `--notrim`）。否则 trim 会裁掉空边：请求 13×12 实际落 11×8，
            // 替换回该关就把盘面改小了（2026-10-24 实测）。
            const cell = levelInfo ? levelInfo.cells[levelCell] : null;
            const exact = !!(cell && $('exactSize').checked);
            const reqCols = exact ? cell.cols : cols;
            const reqRows = exact ? cell.rows : rows;
            const q = new URLSearchParams({
                board: exact
                    ? `${reqCols}x${reqRows}`
                    : ($('board').value === 'custom' ? `${cols}x${rows}` : $('board').value),
                cols: reqCols, rows: reqRows,
                palette: $('palette').value, colors: $('colors').value,
                colorsmode: $('colorsmode').value, cellmode: $('cellmode').value, swaps: $('swaps').value,
                smooth: $('smooth').value, premedian: $('premedian').value, shape: shapeValue(),
                mis: $('misKind').value,
                noframe: $('noframe').checked ? '1' : '0',
                skin: $('skin').value,
            });
            if (exact) q.set('notrim', '1');
            // 关卡标签：让服务端把这条结果记进本关（列表「只看本关」的唯一依据）
            if (levelInfo) q.set('level', levelInfo.uid);
            $('gen').disabled = true; msg('生成中…');
            try {
                // draft=1：只刷效果（写单一草稿位），不落 result.json ⇒ 不进「已存结果」/选图器；
                // 满意后点「确认保存这条结果」才由 /api/drafts/commit 转正。
                const r = await fetch('/api/generate?' + q + '&draft=1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ w: srcPixels.w, h: srcPixels.h, data: toB64(srcPixels.data), thumb: srcThumb }),
                });
                const j = await r.json();
                if (!r.ok) throw new Error(j.error || r.status);
                current = j; show(j);
                msg(`已生成预览：${j.id}｜实际盘 ${j.cols}×${j.rows}` +
                    (exact ? `（按该关尺寸 ${cell.cols}×${cell.rows}，未裁边）` : '') +
                    '｜满意再点「✓ 确认保存这条结果」才进历史', 'ok');
                // 预览尚未入库 ⇒ 暂不给「替换回该关」；若它恰好等于本关图案，只在关卡条报"已在用"
                if (levelInfo) renderLevelBar(null, sameAsLevel(j) ? j.id : null);
                loadResults(j.id);                     // 预览也进列表（「预览」组，标「使用中」）
            } catch (e) { msg('生成失败：' + e.message, 'err'); }
            $('gen').disabled = false;
        };

        /** [WXG-T-222 用户规格] 渲染画布 = **格数 × 128px**（sprite 原生 1:1 映射，零缩放采样损失）；
         *  展示 CSS 缩小到不超过展示区域的最大尺寸；**左键点击放大、右键点击缩小**，
         *  zoom ∈ [0.2×, 2.0×]（相对 contain 适配尺寸）。 */
        const boardPx = (cols) => Math.min(8192, Math.max(420, cols * 128));
        let boardFit = 420, boardZoom = 1; // contain 适配尺寸 / 当前缩放

        function applyBoardZoom() {
            const cv = $('cv');
            const w = Math.round(boardFit * boardZoom);
            cv.style.width = cv.style.height = w + 'px';
            cv.title = view === 'src' ? '' : `×${boardZoom.toFixed(2)}（左键放大 / 右键缩小）`;
        }

        /** 行字符串数组（pattern / misplaced）→ 画布：绘制逻辑全部在 /board-render.js（与游戏版面同一视觉契约，可复用模块）。
         *  pattern 一并传入 ⇒ 目标色坑/垫与背景同画，**正解与错位两视图同底**（view-model 同源）。
         *  [WXG-T-222] opts.tint = TintBoard.current() ⇒ 版面按 tint 档位渲染（每格 mask sprite × 格色）。 */
        function drawBoard(rowsArr) {
            lastBoardRows = rowsArr;
            const cv = $('cv');
            const px = boardPx(current.cols);
            if (cv.width !== px) { cv.width = px; cv.height = px; }
            boardFit = Math.min(cv.parentElement.clientWidth - 24 || 420, 560);
            boardZoom = 1;
            applyBoardZoom();
            BeadsBoardRender.drawBoard(cv.getContext('2d'), cv.width, cv.height, rowsArr, {
                cols: current.cols, rows: current.rows,
                pattern: current.levelDraft?.pattern, hexes: current.paletteHex,
                tint: window.TintBoard ? TintBoard.current() : null,
            });
        }

        /** 原图视图：把缩略图等比画到画布中央（contain，不裁剪）。缩放重置（zoom 只服务版面）。 */
        function drawSrc(dataUrl) {
            const cv = $('cv'), g = cv.getContext('2d');
            if (cv.width !== 420) { cv.width = 420; cv.height = 420; } // 原图视图恒 420（盘面大尺寸只服务版面）
            boardZoom = 1;
            boardFit = 420;
            applyBoardZoom();
            g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
            if (!dataUrl) {
                g.fillStyle = '#999'; g.font = '16px sans-serif'; g.textAlign = 'center';
                g.fillText('本条结果未存原图缩略图（旧数据）', cv.width / 2, cv.height / 2);
                return;
            }
            const im = new Image();
            im.onload = () => {
                const k = Math.min(cv.width / im.width, cv.height / im.height);
                const w = im.width * k, h = im.height * k;
                g.drawImage(im, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
            };
            im.src = dataUrl;
        }

        function show(r) {
            if (view === 'src') drawSrc(srcUrl || r.thumb || srcThumb); // 本会话选过图 ⇒ 原文件直显；历史条目只有缩略图
            else if (view === 'solved') drawBoard(r.levelDraft?.pattern || r.pattern); // mis=none 无 levelDraft，用顶层 pattern
            else drawBoard(r.misplaced?.length ? r.misplaced : r.pattern);
            const rp = r.report || {};
            const df = rp.difficulty;
            $('stats').textContent = r.fromLevel
                // 载入的关卡没有生成报告：只报真源里有的字段，别拿 '?' 冒充统计
                ? `${r.cols}×${r.rows}｜可填 ${rp.fillable ?? '—'}｜用色 ${r.colors}｜错位 ${Array.isArray(r.misplaced) && r.misplaced.length ? '真源已存（切「错位图」看）' : '无'}`
                : `${r.cols}×${r.rows}｜可填 ${rp.fillable ?? '?'}｜用色 ${r.colors}｜错位 ${r.misMode === 'full' ? '全错位（每颗可填珠都不就位）' : r.misMode === 'max' ? `最大化错位（错开 ${rp.mis?.M ?? '?'} 颗、强制就位 ${rp.mis?.F ?? '?'} 颗；N=${rp.mis?.N ?? '?'}/m=${rp.mis?.m ?? '?'}）` : r.misMode === 'none' ? '不错位（实物图纸模式）' : `${r.swaps * 2} 颗（${r.swaps} 对交换）`}\n` +
                `色差 ${rp.colorError?.final ?? '?'}｜同色相邻率 ${rp.clusteringMisplaced?.adjRate ?? (df ? df.adjRate : '?')}` +
                (df ? (df.error
                    ? `\n难度 ——（${df.error}）`
                    : `\n难度 D${df.score}（真引擎实测 ${df.taps} 次点击｜错位 ${df.misplaced} 颗）｜预估清关 ${df.timeEst}s（公式 v0.2 = taps × ${df.secPerTap}s，§5）` +
                    (df.blockers?.length ? `\n⛔ 不可入关：${df.blockers.join('；')}` : ''))
                    : '');
            $('dl').disabled = $('cp').disabled = !(r.levelDraft);
            // 预览（draft）还没进 data/<board>/<id>/ ⇒ 烘焙按 id 找目录会扑空，先禁用并说明
            // （入关已不在本页：统一走管理页，见下方 [WXG-T-341] 注）
            // 只有「尚未入库的预览」能确认保存：已存结果 / 载入的关卡都没有这个身份
            $('commit').disabled = !r.draft;
            $('commit').title = r.draft ? '' : '只对刚生成的预览有效：历史条目已在库中，无需再保存';
            // 不可入关就显式标红 + 说原因（静默换色比报错难查，不能只靠用户自己避坑）。
            // 实物图纸模式（mis=none）下这些全是游戏导入门槛，对图纸用途一条都不适用
            // （色板 artkal-s 对图纸反而正解）⇒ 降为 ℹ 提示，不吓人（2026-09-21 用户拍板）。
            const isPaper = r.misMode === 'none';
            // 载入的关卡不是"待入关结果"，标「不可入关」会误导（用户会以为这关坏了）
            $('badge').textContent = r.fromLevel
                ? 'ℹ 关卡真源当前图案（只读载入）：生成预览 → 确认保存 → 再「替换回该关」'
                : r.importable === false
                    ? (isPaper ? 'ℹ 游戏入关限制（实物图纸不受影响）：' : '⚠ 不可入关：') + (r.blockers || []).join('；')
                    : '';
            $('badge').className = r.fromLevel ? '' : 'bad';
            // [WXG-T-221] 把当前结果交给预烘模块（启用/置灰按 demo 盘判定）。
            if (window.updateBakeButton) window.updateBakeButton(r);
            if (r.draft) {                       // 预览未落盘：烘焙按 id 找目录会扑空
                $('bake').disabled = true;
                $('bake').title = '预览未入库：先「确认保存」再烘焙';
            }
        }

        /** 三视图切换（原图 / 正解 / 错位）。 */
        const TABS = { tSrc: 'src', tSolved: 'solved', tMis: 'mis' };
        for (const [btn, v] of Object.entries(TABS)) {
            $(btn).onclick = () => {
                view = v;
                for (const b of Object.keys(TABS)) $(b).className = b === btn ? 'on' : '';
                if (current) show(current);
                else if (v === 'src') drawSrc(srcUrl || srcThumb);
            };
        }

        // [WXG-T-222] tint 档位就绪/切换 ⇒ 版面按 tint 渲染重绘（原图视图不动）
        document.addEventListener('tint-change', () => {
            if (lastBoardRows && current) drawBoard(lastBoardRows);
        });

        // [WXG-T-222 用户规格] 版面缩放：左键放大 / 右键缩小（阻止系统菜单），zoom ∈ [0.2, 2.0]
        $('cv').addEventListener('click', () => {
            if (view === 'src' || !current) return;
            boardZoom = Math.min(2, boardZoom * 1.25);
            applyBoardZoom();
        });
        $('cv').addEventListener('contextmenu', (ev) => {
            ev.preventDefault();
            if (view === 'src' || !current) return;
            boardZoom = Math.max(0.2, boardZoom / 1.25);
            applyBoardZoom();
        });

        $('dl').onclick = () => {
            const blob = new Blob([JSON.stringify(current.levelDraft, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `beads-${current.id}.json`; a.click();
        };
        $('cp').onclick = () => navigator.clipboard.writeText((current.levelDraft?.pattern || []).join('\n'))
            .then(() => msg('rowstrings 已复制', 'ok'));

        // WXG-T-341：入关**只在管理页**做（`/manage.html` 的批量导入 + 章内导入下拉）。
        // 本页原有一个「导入大关…」跳转按钮，2026-10-24 用户裁定去掉：两处入口各长一套，改不动时
        // 没人说得清哪边是真源。管理页仍支持 `?result=<id>` 预选，需要时手拼 URL 即可。

        /** 把列表里的任一条（已存结果 或 预览草稿）应用为当前。
         *  已入库 ⇒ 可下载/烘焙/替换回该关（入关统一在管理页）；预览 ⇒ 先「确认保存」转正再走这几步。
         *  应用后重跑列表：靠 `current.id` 把「使用中」标到这一行（不另存状态，避免两处漂移）。 */
        function applyResult(r) {
            current = r;
            show(r);
            const cell = levelInfo ? levelInfo.cells[levelCell] : null;
            const dimDiff = cell && (r.cols !== cell.cols || r.rows !== cell.rows)
                ? `｜实际盘 ${r.cols}×${r.rows} ≠ 该关 ${cell.cols}×${cell.rows}：替换回该关会改盘面尺寸`
                : '';
            // 已在用（= 与本关当前图案逐字相同）⇒ 不给替换按钮，只报状态：替换自己没有任何效果
            const src = !r.draft && sameAsLevel(r);
            msg(`已应用${r.draft ? '预览（未入库，先「确认保存」才能替换回该关）' : src ? '正在使用的方案' : '历史结果'}：${r.id}｜实际盘 ${r.cols}×${r.rows}` +
                (src ? '｜＝本关当前图案，无需替换' : '') +
                (!r.draft && !src && levelInfo ? `｜可点关卡条「用 ${r.id} 替换 ${levelInfo.uid}」` : '') + dimDiff, 'ok');
            // 预览目录在 data/_draft/<id>（按 id 找 result.json 会扑空）⇒ 不给替换入口
            if (levelInfo) renderLevelBar(r.draft || src ? null : r.id, src ? r.id : null);
            loadResults(r.id);
        }

        /** 单条结果行（轻投影；点开才拉全文）。`inUse` = 当前应用在画布上的那条（标「使用中」）。
         *  只处理**已确认保存**的结果（预览草稿不展示，2026-10-25 用户要求）。 */
        function resultItem(r, inUse) {
            const d = document.createElement('div'); d.className = 'item' + (inUse ? ' on' : '');
            const noImp = r.importable === false;
            const mis = r.misMode === 'full' ? '全错位' : r.misMode === 'max' ? '最大化错位' : r.misMode === 'none' ? '不错位' : '错位 ' + r.swaps * 2;
            // 尺寸用**实际盘面**（trim 后），与 id 里的请求档位可能不同；「使用中」必须显式写出来，
            // 否则一列 id 看下来没人知道画布上是哪条（2026-10-24 用户要求）。
            const tag = inUse ? '<b style="color:var(--ac)">使用中</b> · ' : '';
            d.innerHTML = `<span title="${r.id}">${noImp ? (r.misMode === 'none' ? 'ℹ ' : '⚠ ') : ''}${r.id}</span>` +
                `<small>${tag}${r.cols}×${r.rows} · ${r.colors} 色 · ${mis}${noImp ? (r.misMode === 'none' ? ' · 游戏不入关' : ' · 不可入关') : ''}</small>`;
            d.title = '点击应用为当前（可下载 / 烘焙 / 替换回该关；入关去大关管理页）';
            d.onclick = async () => {
                try {
                    const res = await fetch('/api/results/' + r.id);
                    const full = await res.json();
                    if (!res.ok || full.error) throw new Error(full.error || ('HTTP ' + res.status));
                    applyResult(full);
                } catch (e) { msg(`取详情失败：${r.id}（${e.message}）`, 'err'); }
            };
            // 删除钮：**唯一的删除入口**（点行只应用、不删）。不可逆 ⇒ 二次确认。
            const x = document.createElement('button');
            x.className = 'del'; x.textContent = '✕'; x.title = '删除这条结果（不可恢复）';
            x.onclick = async (ev) => {
                ev.stopPropagation();
                if (!confirm(`删除 ${r.id}？\n磁盘上只有一份，不可恢复。`)) return;
                try {
                    const res = await fetch('/api/results/' + r.id, { method: 'DELETE' });
                    if (!res.ok) {
                        const j = await res.json().catch(() => ({}));
                        return msg('删除失败：' + (j.error || res.status), 'err');
                    }
                    if (current && current.id === r.id) {
                        current = null;
                        $('cv').getContext('2d').clearRect(0, 0, 420, 420);
                        if (levelInfo) renderLevelBar(null);   // 别留一个指向已删 id 的「替换回该关」
                    }
                    msg('已删除 ' + r.id, 'ok');
                    loadResults();
                } catch (e) { msg('删除失败：' + e.message, 'err'); }
            };
            d.appendChild(x);
            return d;
        }

        /** 拉「已存结果」+「预览草稿」合并渲染。`focusId` = 刚生成/刚保存的那条（滚入视区）。
         *  口径（2026-10-24 用户）：**关卡模式下只列本关的记录**——判据是结果上的 `linkedLevels`
         *  （生成时由 `?level=` 打标，替换成功时反向补标）；不做尺寸筛选（尺寸只作展示，替换时的
         *  尺寸变化由确认框与提示条告警）。不带 `?level=` 时照旧全量列出。
         *  「使用中」= `current.id`，所以任何应用/生成/保存后都要重跑本函数。 */
        async function loadResults(focusId) {
            try {
                // 只列**已确认保存**（data/<board>/<id>/）的条目：预览草稿一律不展示（2026-10-25 用户要求），
                // 但它们仍在磁盘上、不会被自动清理 —— 只有右侧 ✕ 能删。
                const rs = await fetch('/api/results').then((x) => x.json()).catch(() => ({}));
                const allResults = Array.isArray(rs.results) ? rs.results : [];
                const cell = levelInfo ? levelInfo.cells[levelCell] : null;
                const uid = levelInfo ? levelInfo.uid : '';
                // 本关 = linkedLevels 命中该 uid。无标签的旧条目**不混进来**（它们属于别的关 / 不属于任何关），
                // 数量在标题里报出来，免得用户以为"记录被删了"。
                const mine = (r) => !uid || (Array.isArray(r.linkedLevels) && r.linkedLevels.includes(uid));
                const results = allResults.filter(mine);
                const hidden = uid ? allResults.length - results.length : 0;
                const el = $('results');
                el.innerHTML = `<b>已存结果</b> <small>（` +
                    (uid ? `本关 ${uid}${cell ? ` · ${cell.cols}×${cell.rows}` : ''} · ` : '') +
                    `已存 ${results.length} 条` +
                    (hidden ? `｜另 ${hidden} 条属其它关/未标关，已隐藏` : '') +
                    `｜点行应用为当前，只有 ✕ 删除）</small>` +
                    // 草稿不再展示（2026-10-25）⇒ 批量清理只在这里露出一个出口
                    `<button class="ghost" id="cleanDrafts" style="font-size:12px;padding:2px 8px;margin-left:8px;width:auto" title="删除 data/_draft 下所有未入库草稿（画布上正在用的那条会保留）">清理草稿</button>`;
                $('cleanDrafts').onclick = cleanDrafts;
                const curId = current && !current.fromLevel ? current.id : '';
                let focusEl = null;
                const mkRow = (r) => {
                    const it = resultItem(r, r.id === curId);
                    if (r.id === focusId) focusEl = it;
                    return it;
                };
                const byBoard = {};
                for (const r of results) (byBoard[r.board] ??= []).push(r);
                for (const [board, list] of Object.entries(byBoard)) {
                    const g = document.createElement('div'); g.className = 'grp';
                    g.innerHTML = `<h3>${board}（${list.length}）</h3>`;
                    for (const r of list) g.appendChild(mkRow(r));
                    el.appendChild(g);
                }
                if (uid && !results.length) {
                    const g = document.createElement('div'); g.className = 'grp';
                    g.innerHTML = '<small style="color:#999">本关还没有记录 —— 在本页「生成预览」→「✓ 确认保存」后就会出现在这里' +
                        '（带历史标记的才属于本关；从 `/` 生成再「替换回该关」的也会自动归到本关）</small>';
                    el.appendChild(g);
                }
                focusEl?.scrollIntoView({ block: 'nearest' });
            } catch { /* 列表失败不阻塞主函数 */ }
        }

        /** 一键清理未入库草稿（`data/_draft/*`）。草稿已不展示 ⇒ 这是唯一的批量出口；
         *  **保留画布上那条未入库的预览**（`current.draft`），否则刚生成、还没「确认保存」的会被自己删掉。 */
        async function cleanDrafts() {
            const btn = $('cleanDrafts');
            try {
                const list = await fetch('/api/previews').then((x) => x.json())
                    .then((j) => (Array.isArray(j.previews) ? j.previews : [])).catch(() => []);
                const keep = current && current.draft ? current.id : '';
                const todo = list.filter((p) => p.id !== keep);
                if (!todo.length) return msg(`没有可清理的草稿${keep ? '（画布上这条已保留）' : ''}`, 'ok');
                if (btn) btn.disabled = true;
                const ok = confirm(`清理 ${todo.length} 条未入库草稿？\n` +
                    (keep ? `保留画布上正在用的 ${keep}；\n` : '') + '磁盘上只有一份，不可恢复。');
                if (!ok) { if (btn) btn.disabled = false; return; }
                const res = await fetch('/api/previews' + (keep ? '?keep=' + encodeURIComponent(keep) : ''), { method: 'DELETE' });
                const j = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
                msg(`已清理 ${j.deleted} 条草稿` + (j.kept ? `（保留 ${j.kept}）` : ''), 'ok');
            } catch (e) {
                msg('清理失败：' + e.message, 'err');
            } finally {
                const b = $('cleanDrafts');   // 列表可能已重绘 ⇒ 重新取一次再解锁
                if (b) b.disabled = false;
            }
        }

        // ── [?level=<uid>] 大关管理页 → 生成页（WXG-T-373）：载入该关图案，编辑完一键替换回该关 ──
        //    关卡真源只读（GET /api/levels/:uid）；写回仍走既有 /api/manage/level/:uid/replace
        //    （门禁⑦/⑧ + bot 实测 + 快照回滚都在里面，本页不碰写盘协议）。
        const levelUid = new URLSearchParams(location.search).get('level') || '';
        let levelInfo = null;    // { uid, kind, chapter, cells[] }
        let levelCell = 0;       // plate 多格时的当前格

        function mkEl(tag, txt, css) {
            const d = document.createElement(tag);
            if (txt !== undefined) d.textContent = txt;
            if (css) d.style.cssText = css;
            return d;
        }

        /** 关卡条（通栏一行）：左侧一行关信息，右侧操作（逐格切换 / 替换回该关 / 回列表）。
         *  说明文字不再铺一段——按钮已写明「不入历史」「确认保存」，重复交代只会占掉版面。 */
        /** 该条图案是否**逐字等于**本关当前图案（= 已经在用）。
         *  用它判"当前方案"而不是另存一个来源 id：关卡被手改过 ⇒ 自然没有匹配，不需要维护额外状态。 */
        function sameAsLevel(r) {
            const cell = levelInfo ? levelInfo.cells[levelCell] : null;
            const target = (cell?.paint?.pattern || []).join('|');
            if (!target) return false;
            const pat = (r?.levelDraft?.pattern || r?.pattern || []).join('|');
            return !!pat && pat === target;
        }

        /** 进二级页时自动认领「本关当前方案」：图案逐字相同的本关条目 ⇒ 直接标「使用中」、画布切到它、
         *  **不显示替换按钮**（替换自己＝空操作）。没有匹配就保持载入态（初始状态，2026-10-25 用户要求）。 */
        async function markLevelSource() {
            const cell = levelInfo ? levelInfo.cells[levelCell] : null;
            if (!cell || !(cell.paint?.pattern || []).length) return;
            const uid = levelInfo.uid;
            try {
                // 只认**已确认保存**的条目（预览不展示也不参与认领）
                const rs = await fetch('/api/results').then((x) => x.json()).catch(() => ({}));
                // 只在**本关**条目里找（linkedLevels 命中），按新→旧最多试 12 条，避免为认领拉全库详情
                const cands = (rs.results || [])
                    .filter((r) => (r.linkedLevels || []).includes(uid)).slice(0, 12);
                for (const r of cands) {
                    const full = await fetch('/api/results/' + r.id).then((x) => (x.ok ? x.json() : null)).catch(() => null);
                    if (!full || full.error || !sameAsLevel(full)) continue;
                    current = full;
                    show(full);
                    renderLevelBar(null, full.id);   // 已在用 ⇒ 只报状态
                    loadResults(full.id);
                    return;
                }
            } catch { /* 认领失败 ⇒ 按初始态显示，不影响编辑 */ }
        }

        /** `generatedId` = 可替换回该关的候选（已入库、且不等于本关当前图案）；
         *  `inUseId` = 本关当前图案的**来源条目**（图案逐字相同 ⇒ 已在用）⇒ 只报状态、不给替换按钮，
         *  因为"用自己替换自己"是空操作（2026-10-25 用户要求）。 */
        function renderLevelBar(generatedId, inUseId) {
            const bar = $('lvbar');
            if (!levelInfo) { bar.hidden = true; return; }
            const c = levelInfo.cells[levelCell];
            const idTxt = `#${c.id}${c.idEnd !== undefined && c.idEnd !== c.id ? '–' + c.idEnd : ''}`;
            bar.hidden = false;
            bar.innerHTML = '';
            bar.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap';
            const info = mkEl('div', undefined, 'display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0');
            info.appendChild(mkEl('b', `正在编辑 ${levelInfo.uid}`));
            info.appendChild(mkEl('span',
                `${idTxt}${c.name ? ' · ' + c.name : ''} · ${c.cols}×${c.rows}` +
                (c.time != null ? ` · 实测 ${c.time}s` : '') + (c.steps != null ? ` / ${c.steps} 步` : '') +
                (levelInfo.chapter ? ` · 章「${levelInfo.chapter.title}」` : '') +
                (levelInfo.cells.length > 1 ? ` · 第 ${levelCell + 1}/${levelInfo.cells.length} 格` : ''),
                'font-size:12px;color:#666'));
            bar.appendChild(info);

            const acts = mkEl('div', undefined, 'display:flex;gap:6px;align-items:center;flex-wrap:wrap');
            if (levelInfo.cells.length > 1) {
                levelInfo.cells.forEach((_, i) => {
                    const b = mkEl('button', `第 ${i + 1} 格`);
                    b.className = 'ghost';
                    if (i === levelCell) b.style.fontWeight = '700';
                    b.onclick = () => { levelCell = i; applyLevelCell(); };
                    acts.appendChild(b);
                });
            }
            if (generatedId) {
                if (levelInfo.kind === 'plate') {
                    acts.appendChild(mkEl('span', 'plate 不支持原位替换：改动去大关管理页「导入大关」重建',
                        'font-size:12px;color:#c0392b'));
                } else {
                    const rep = mkEl('button', `用 ${generatedId} 替换 ${levelInfo.uid} 的图案`);
                    rep.onclick = () => replaceIntoLevel(generatedId);
                    acts.appendChild(rep);
                }
            } else if (inUseId) {
                acts.appendChild(mkEl('span', `本关当前图案＝${inUseId}（已在用，无需替换）`,
                    'font-size:12px;color:var(--ac)'));
            }
            const back = mkEl('a', '← 回关卡列表', 'font-size:12px');
            back.href = '/manage.html';
            acts.appendChild(back);
            bar.appendChild(acts);
        }

        /** 载入的关卡盘 → `current`（与 result 同形，复用 show()/画布/缩放，不另造渲染路径）。 */
        function applyLevelCell() {
            const c = levelInfo.cells[levelCell];
            const pattern = c.paint?.pattern ?? null;
            // 可填珠数 = 非 '.' 格数（载入态没有生成报告，这个数我们自己数得出来）
            const fillable = (pattern || []).reduce((n, row) => n + [...String(row)].filter((ch) => ch !== '.').length, 0);
            current = {
                id: `level-${levelInfo.uid}`, board: `${c.cols}x${c.rows}`,
                cols: c.cols, rows: c.rows,
                palette: '', colors: c.paint?.colors?.length ?? 0,
                misMode: 'full', importable: false,
                pattern, misplaced: c.misplaced,
                paletteHex: c.paint?.colors ?? null,
                levelDraft: { cols: c.cols, rows: c.rows, pattern, ...(c.misplaced ? { misplaced: c.misplaced } : {}) },
                report: { fillable }, fromLevel: levelInfo.uid,
            };
            $('cols').value = c.cols;   // 预填同规格，便于按原尺寸重制
            $('rows').value = c.rows;
            // 「按该关尺寸生成」开关只在关卡模式出现；**默认不勾**（2026-10-24 用户拍板）——
            // 勾上才会强制尺寸/盘位档对齐该关并关掉 trim；不勾就按照片推断尺寸走常规生成。
            $('exactWrap').style.display = '';
            renderLevelBar(null);
            show(current);
            loadResults();              // 「已存结果」按本关尺寸重筛（切格/换关都要跟）
            markLevelSource();          // 进二级页就认领"正在使用的方案"（认出则不给替换按钮）
        }

        async function loadLevel(uid) {
            const r = await fetch('/api/levels/' + encodeURIComponent(uid));
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
            levelInfo = j;
            levelCell = 0;
            applyLevelCell();
        }

        /** 把当前结果（生成预览或应用过来的历史条目）替换回该关（复用管理页同一条写盘路径，不新增协议）。 */
        async function replaceIntoLevel(resultId) {
            const cell = levelInfo.cells[levelCell];
            // 尺寸不一致要在确认框里说清：替换会按新盘面重算，不是"只换图案"（用户上次正是栽在这条）
            const dimWarn = current && current.id === resultId && (current.cols !== cell.cols || current.rows !== cell.rows)
                ? `\n⚠ 盘面尺寸会变：${cell.cols}×${cell.rows} → ${current.cols}×${current.rows}`
                : '';
            if (!confirm(`用 ${resultId} 替换 ${levelInfo.uid} 的图案？\n关名/关号/章位不变，时长按真引擎实测重算；门禁不过整笔回滚。${dimWarn}`)) return;
            try {
                const r = await fetch(`/api/manage/level/${levelInfo.uid}/replace`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resultId }),
                });
                const j = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error((j.error || ('HTTP ' + r.status)) + (j.detail ? '\n—— 门禁原文 ——\n' + j.detail : ''));
                msg(`已替换 ${levelInfo.uid}：` + (j.log || []).join('；'), 'ok');
                await loadLevel(levelInfo.uid);      // 重读真源，看到替换后的图案与实测
            } catch (e) { msg('替换失败：' + e.message, 'err'); }
        }

        (async () => {
            if (!levelUid) return;
            try {
                await loadLevel(levelUid);
                msg(`已载入关卡 ${levelUid}：改完生成，再一键替换回该关`, 'ok');
            } catch (e) {
                const bar = $('lvbar');
                bar.hidden = false;
                bar.style.borderColor = '#f5c6c0';
                bar.textContent = `载入关卡 ${levelUid} 失败：${e.message}`;
            }
        })();

        /** 「确认保存这条结果」：把当前预览从 data/_draft/ 转正进「已存结果」（此前一律不落盘）。 */
        $('commit').onclick = async () => {
            if (!current?.draft) return msg('没有待确认的预览：先点「生成预览」', 'err');
            $('commit').disabled = true;
            try {
                const r = await fetch('/api/drafts/commit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: current.id }),
                });
                const j = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
                current = { ...current, draft: false };
                show(current);          // 刷新徽章/按钮：下载、烘焙、替换回该关这时才可用
                // 保存成功要报**实际盘面**并点名尺寸差：id 里的档位是请求值，trim 后可能小一圈，
                // 不提这一句用户会以为"存的不是我要的"或"根本没存"（2026-10-24 实测）。
                const cell = levelInfo ? levelInfo.cells[levelCell] : null;
                const dimDiff = cell && (current.cols !== cell.cols || current.rows !== cell.rows)
                    ? `｜实际盘 ${current.cols}×${current.rows} ≠ 该关 ${cell.cols}×${cell.rows}（trim 裁空边所致；替换回该关会按新盘面重算）`
                    : '';
                msg(`已存入历史：${j.id}｜实际盘 ${current.cols}×${current.rows}${dimDiff}`, 'ok');
                await loadResults(j.id);                // 高亮并滚到刚存的那条
                // 入库后才有「替换回该关」；但如果它的图案＝本关当前图案（刚从该关导出的同一版），
                // 替换自己是空操作 ⇒ 只报"已在用"（2026-10-25 用户要求）
                if (levelInfo) {
                    const src = sameAsLevel(current);
                    renderLevelBar(src ? null : j.id, src ? j.id : null);
                }
            } catch (e) {
                msg('保存失败：' + e.message, 'err');
                $('commit').disabled = false;
            }
        };

        loadResults();
    </script>
</body>

</html>
