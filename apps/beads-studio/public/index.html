<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>beads-studio · 照片转拼豆</title>
    <style>
        :root {
            --bd: #d8d2c4;
            --bg: #faf7f0;
            --ac: #3d7bf5;
            --tx: #33333d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--tx);
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        h1 {
            font-size: 16px;
            margin: 0;
        }

        main {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
            padding: 16px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width:860px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 14px;
        }

        label {
            display: block;
            margin: 8px 0 2px;
            font-size: 12px;
            color: #666;
        }

        input,
        select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            font: inherit;
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: var(--ac);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        button.ghost {
            background: #eee;
            color: var(--tx);
            margin-top: 6px;
        }

        canvas {
            width: 100%;
            image-rendering: pixelated;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: #fff;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .tabs button {
            margin: 0;
            padding: 5px 10px;
            width: auto;
            background: #eee;
            color: var(--tx);
            font-weight: 400;
            border-radius: 6px;
        }

        .tabs button.on {
            background: var(--ac);
            color: #fff;
        }

        #stats {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            white-space: pre-line;
        }

        .bad {
            font-size: 12px;
            color: #c0392b;
            white-space: pre-line;
        }

        .bad:empty {
            display: none;
        }

        #results .grp {
            margin-top: 12px;
        }

        #results h3 {
            font-size: 13px;
            margin: 6px 0;
            color: #666;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .item:hover {
            border-color: var(--ac);
        }

        .item small {
            color: #999;
        }

        .item .del {
            margin: 0;
            width: 28px;
            height: 28px;
            padding: 0;
            background: transparent;
            color: #999;
            border-radius: 6px;
            font-size: 15px;
        }

        .item .del:hover {
            background: #c0392b;
            color: #fff;
        }

        #msg {
            margin-top: 8px;
            font-size: 12px;
            min-height: 18px;
        }

        .err {
            color: #c0392b;
        }

        .ok {
            color: #1e8e3e;
        }
    </style>
</head>

<body>
    <header>
        <h1>beads-studio</h1><span style="color:#999;font-size:12px">照片 → 拼豆关卡草案（WXG-T-179）· 生成核心 beads-gen.mjs</span>
    </header>
    <main>
        <section class="card">
            <label>源图（本地解像，不上传原图）</label>
            <input type="file" id="file" accept="image/*">
            <label>盘面档位（标准 standard29；选图自动测格切自定义）</label>
            <select id="board">
                <option value="standard29" selected>standard29 · 29×29（5mm Midi 标准方盘）</option>
                <option value="small18">small18 · 18×18</option>
                <option value="small14">small14 · 14×14</option>
                <option value="small16">small16 · 16×16</option>
                <option value="custom">自定义…</option>
            </select>
            <div class="row2" id="customSize" style="display:none">
                <div><label>列</label><input type="number" id="cols" value="29" min="2" max="107"></div>
                <div><label>行</label><input type="number" id="rows" value="29" min="2" max="107"></div>
            </div>
            <div class="row2">
                <div><label>候选色集合（量化目标色）</label><select id="palette">
                        <optgroup label="Artkal">
                            <option value="artkal-s" selected>S 系 5mm 硬豆 · 210 色</option>
                            <option value="artkal-c">C 系 2.6mm 硬豆 · 174 色</option>
                            <option value="artkal-a">A 系 2.6mm 软豆 · 145 色</option>
                            <option value="artkal-m">M 系 2.6mm 软豆 · 220 色</option>
                            <option value="artkal-r" disabled>R 系 5mm 软豆 · 89 色（敬请期待）</option>
                        </optgroup>
                        <optgroup label="Hama">
                            <option value="hama-midi">Midi 5mm · 92 色</option>
                            <option value="hama-mini">Mini 3mm · 78 色</option>
                            <option value="hama-maxi">Maxi 10mm · 25 色</option>
                        </optgroup>
                        <optgroup label="Perler">
                            <option value="perler">Perler 5mm · 103 色</option>
                            <option value="perler-mini">Mini 2.6mm · 41 色</option>
                            <option value="perler-caps">Caps 空心珠 · 26 色</option>
                        </optgroup>
                        <optgroup label="其他">
                            <option value="nabbi">Nabbi · 30 色</option>
                            <option value="yant">Yant · 119 色</option>
                            <option value="mard">MARD · 291 色</option>
                            <option value="diamond-dotz">Diamond Dotz 钻石画 · 461 色</option>
                        </optgroup>
                    </select></div>
                <div><label>实际用几种颜色<span id="colorsHint">（参考图，不可入关）</span></label><input type="number" id="colors"
                        value="8" min="3" max="35"></div>
            </div>
            <div class="row2">
                <div><label>错位密度</label><select id="misKind">
                        <option value="none" selected>不错位（实物图纸 · 最像原图）</option>
                        <option value="full">全错位（每颗可填珠都不就位）</option>
                        <option value="swaps">少量交换（k 对 ⇒ 仅 2k 颗错位）</option>
                    </select></div>
                <div id="swapsBox" style="display:none"><label>交换对数 k（1–8）</label><input type="number" id="swaps"
                        value="8" min="1" max="8"></div>
                <div><label>众数滤波轮数（0 = 关，保细节；大块风可 1–2）</label><input type="number" id="smooth" value="0" min="0"
                        max="5"></div>
                <div><label>源图中值滤波（量化前，消除 JPEG 伪影）</label><select id="premedian">
                        <option value="0" selected>关</option>
                        <option value="3">3×3（推荐照片）</option>
                        <option value="5">5×5（低质压缩图）</option>
                    </select></div>
            </div>
            <div class="row2">
                <div><label>盘面形状</label><select id="shapeKind">
                        <option value="rect" selected>长方形</option>
                        <option value="free">非长方形</option>
                    </select></div>
                <div id="freeShapeBox" style="display:none"><label>非长方形轮廓</label><select id="freeShape">
                        <option value="circle" selected>圆形</option>
                        <option value="hex">六边形</option>
                        <option value="heart">心形</option>
                    </select></div>
                <div><label>选色模式（限色时挑哪几种）</label><select id="colorsmode">
                        <option value="error" selected>误差最小·保形（推荐）</option>
                        <option value="freq">频次优先·保大块</option>
                    </select></div>
                <div><label>格级风格</label><select id="cellmode">
                        <option value="mode" selected>主导色·卡通干净</option>
                        <option value="avg">平均色·照片纹理</option>
                    </select></div>
            </div>
            <label style="margin-top:10px"><input type="checkbox" id="noframe" style="width:auto">
                铺满整盘（不扣背景；仅游戏关卡盘用——**实物图纸还原务必保持不勾**，否则背景吃掉大半用色预算）</label>
            <button id="gen">生成</button>
            <div id="msg"></div>
        </section>
        <section>
            <div class="card">
                <canvas id="cv" width="420" height="420"></canvas>
                <div class="tabs">
                    <button id="tSrc">原图</button>
                    <button id="tSolved" class="on">正解图</button>
                    <button id="tMis">错位图（初始盘）</button>
                </div>
                <div id="badge" class="bad"></div>
                <div id="stats"></div>
                <button class="ghost" id="dl" disabled>下载 levelDraft JSON</button>
                <button class="ghost" id="cp" disabled>复制 rowstrings</button>
                <button class="ghost" id="ing" disabled>一键入关（写回关卡表）</button>
            </div>
            <div class="card" id="results"><b>已存结果</b> <small>（GET /api/results，小游戏在线导入同源）</small></div>
        </section>
    </main>
    <!-- 盘面绘制共享模块（视觉正源 = games/beads/src/view/{palette,bead-render}.ts，见文件头同步表） -->
    <script src="/board-render.js"></script>
    <script>
        'use strict';
        const $ = (id) => document.getElementById(id);
        let current = null; // 当前 result.json
        let srcPixels = null; // {w,h,data:Uint8ClampedArray} —— 送服务端的解像结果
        let srcThumb = null;  // 原图缩略图 dataURL（选图即生，随 POST 存盘 ⇒ 历史条目也能看）
        let srcUrl = null;    // 原文件 objectURL（src 视图预览用：448 缩略图放大必糊，2026-09-21）
        let view = 'solved';

        const THUMB_MAX = 448; // ≈ 预览画布宽，原图视图够用且存盘体积可控

        /** Uint8ClampedArray → base64（分块，避免 fromCharCode 参数上限）。 */
        function toB64(u8) {
            let s = '';
            for (let i = 0; i < u8.length; i += 0x8000) {
                s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
            }
            return btoa(s);
        }

        /** 盘面形状：只区分「长方形 / 非长方形」；非长方形再选具体轮廓（铺满由 beads-gen 保证）。 */
        const shapeValue = () => ($('shapeKind').value === 'rect' ? 'square' : $('freeShape').value);
        $('shapeKind').onchange = () => {
            $('freeShapeBox').style.display = $('shapeKind').value === 'free' ? 'block' : 'none';
        };

        /** 用色域联动（v1.40 品牌引用制）：全部为品牌色板，3–35 参考图；入关不限色板
         *  —— 关卡写回 slug+色号，游戏侧从品牌注册表查 hex 渲染。 */
        function syncColorsDomain() {
            $('colors').min = 3; $('colors').max = 35;
            $('colorsHint').textContent = '（参考图，可入关：写回品牌色号）';
        }
        $('palette').onchange = syncColorsDomain;
        syncColorsDomain();

        /** 错位密度：全错位（引擎 misplaced 初盘，成片错豆）/ 少量交换（才需要 k）。 */
        $('misKind').onchange = () => {
            $('swapsBox').style.display = $('misKind').value === 'swaps' ? 'block' : 'none';
        };

        $('board').onchange = () => {
            const b = $('board').value;
            $('customSize').style.display = b === 'custom' ? 'grid' : 'none';
            const map = { small14: [14, 14], small18: [18, 18], small16: [16, 16], standard29: [29, 29] };
            if (map[b]) { $('cols').value = map[b][0]; $('rows').value = map[b][1]; }
        };

        $('file').onchange = async () => {
            const f = $('file').files[0];
            if (!f) return;
            const img = await createImageBitmap(f);
            // v1.5（2026-09-21 用户拍板）：不缩图——原始 px 尺寸是测格/豆数计算的输入，
            // 缩图会破坏珠距检测与成品尺寸换算。仅拦超限：body 上限 4096²（与服务端 MAX_BODY 对齐）。
            if (Math.max(img.width, img.height) > 4096) {
                msg(`原图 ${img.width}×${img.height} 超过 4096 解像上限，请先自行缩小后重选`, 'err');
                return;
            }
            const w = img.width, h = img.height;
            const cv = new OffscreenCanvas(w, h);
            const g = cv.getContext('2d', { willReadFrequently: true });
            g.drawImage(img, 0, 0, w, h);
            srcPixels = { w, h, data: g.getImageData(0, 0, w, h).data };
            // 依据原图测横竖豆数（珠距自相关检测）+ 候选色板标准豆径换算成品尺寸
            const sug = detectBeadGrid(srcPixels);
            let sugMsg = '';
            if (sug) {
                const mm = parseFloat(($('palette').selectedOptions[0]?.textContent || '').match(/([\d.]+)\s*mm/)?.[1]) || 5;
                $('board').value = 'custom'; $('customSize').style.display = 'grid';
                $('cols').value = sug.cols; $('rows').value = sug.rows;
                sugMsg = `｜珠距检测 ${sug.gx}×${sug.gy}px ⇒ 建议 ${sug.cols}×${sug.rows} 格（成品 ${(sug.cols * mm / 10).toFixed(1)}×${(sug.rows * mm / 10).toFixed(1)} cm @${mm}mm 豆径，可手改）`;
            }
            // 原图缩略图（选图时本地生成，不依赖服务端返图）
            const tk = Math.min(1, THUMB_MAX / Math.max(img.width, img.height));
            const tw = Math.max(1, Math.round(img.width * tk)), th = Math.max(1, Math.round(img.height * tk));
            const tc = new OffscreenCanvas(tw, th);
            tc.getContext('2d').drawImage(img, 0, 0, tw, th);
            srcThumb = await blobToDataURL(await tc.convertToBlob({ type: 'image/jpeg', quality: 0.72 }));
            msg(`源图已解像：${w}×${h}（RGBA ${Math.round(w * h * 4 / 1024)} KB）｜缩略图 ${tw}×${th}${sugMsg}`, 'ok');
            if (srcUrl) URL.revokeObjectURL(srcUrl);
            srcUrl = URL.createObjectURL(f); // 预览用原文件，缩略图只随 POST 存盘
            if (view === 'src') drawSrc(srcUrl); // 未生成时也能先看原图
        };

        /** 珠栅检测（WXG-T-179）：亮度对 |Δ| 平移自相关——平移量恰为真实珠距时，
         *  采样点与自身同珠对齐 ⇒ 平均差最小。横竖各自独立测；检测到即自动切自定义
         *  档位填入建议格数（可手改）。纯启发式：透视/局部/虚化图会测偏，用户可改。 */
        function detectBeadGrid(px) {
            const { w, h, data } = px;
            const lum = new Float32Array(w * h);
            for (let i = 0; i < w * h; i++) lum[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
            const diffAt = (dx, dy) => {
                let s = 0, n = 0;
                for (let y = dy; y < h; y += 3) {
                    for (let x = dx; x < w; x += 3) { s += Math.abs(lum[y * w + x] - lum[(y - dy) * w + x - dx]); n++; }
                }
                return n ? s / n : 255;
            };
            const bestPitch = (dx, dy, len) => {
                let bp = 0, bs = Infinity;
                for (let p = 8; p <= Math.min(100, len >> 2); p++) {
                    const s = diffAt(dx * p, dy * p);
                    if (s < bs) { bs = s; bp = p; }
                }
                // 半频抑制：2p₀ 也对齐（都打在同珠上），若 p₀/2 的分不比最低分差 8% 则取更细者
                if (bp >= 16) {
                    const hs = diffAt(dx * (bp >> 1), dy * (bp >> 1));
                    if (hs <= bs * 1.08) bp >>= 1;
                }
                return bp;
            };
            const gx = bestPitch(1, 0, w), gy = bestPitch(0, 1, h);
            if (!gx || !gy) return null;
            return { cols: Math.max(2, Math.round(w / gx)), rows: Math.max(2, Math.round(h / gy)), gx, gy };
        }

        // 自检：合成 8×8 均匀色块（12px 栅距）应检出 8×8；失败仅 console 警告，不打扰用户
        (function selfTestBeadGrid() {
            const P = 12, N = 8, w = P * N, h = P * N;
            const cell = [];
            let seed = 42;
            const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
            for (let i = 0; i < N * N; i++) cell.push(Math.floor(rnd() * 256));
            const data = new Uint8ClampedArray(w * h * 4);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const gv = cell[Math.floor(y / P) * N + Math.floor(x / P)], o = (y * w + x) * 4;
                data[o] = gv; data[o + 1] = (gv * 3) % 256; data[o + 2] = 255 - gv; data[o + 3] = 255;
            }
            const r = detectBeadGrid({ w, h, data });
            if (!r || r.cols !== N || r.rows !== N) console.warn('珠栅检测自检失败：', r);
        })();

        async function blobToDataURL(blob) {
            const buf = new Uint8Array(await blob.arrayBuffer());
            let s = '';
            for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
            return 'data:' + blob.type + ';base64,' + btoa(s);
        }

        function msg(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }

        $('gen').onclick = async () => {
            if (!srcPixels) return msg('先选源图', 'err');
            const cols = parseInt($('cols').value, 10), rows = parseInt($('rows').value, 10);
            if (!cols || !rows) return msg('盘面尺寸非法', 'err');
            const q = new URLSearchParams({
                board: $('board').value === 'custom' ? `${cols}x${rows}` : $('board').value,
                cols, rows,
                palette: $('palette').value, colors: $('colors').value,
                colorsmode: $('colorsmode').value, cellmode: $('cellmode').value, swaps: $('swaps').value,
                smooth: $('smooth').value, premedian: $('premedian').value, shape: shapeValue(),
                mis: $('misKind').value,
                noframe: $('noframe').checked ? '1' : '0',
            });
            $('gen').disabled = true; msg('生成中…');
            try {
                const r = await fetch('/api/generate?' + q, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ w: srcPixels.w, h: srcPixels.h, data: toB64(srcPixels.data), thumb: srcThumb }),
                });
                const j = await r.json();
                if (!r.ok) throw new Error(j.error || r.status);
                current = j; show(j); msg(`已生成并存储：${j.id}`, 'ok'); loadResults();
            } catch (e) { msg('生成失败：' + e.message, 'err'); }
            $('gen').disabled = false;
        };

        /** 行字符串数组（pattern / misplaced）→ 画布：绘制逻辑全部在 /board-render.js（与游戏版面同一视觉契约，可复用模块）。
         *  pattern 一并传入 ⇒ 目标色坑/垫与背景同画，**正解与错位两视图同底**（view-model 同源）。 */
        function drawBoard(rowsArr) {
            const cv = $('cv');
            BeadsBoardRender.drawBoard(cv.getContext('2d'), cv.width, cv.height, rowsArr, { cols: current.cols, rows: current.rows, pattern: current.levelDraft?.pattern, hexes: current.paletteHex });
        }

        /** 原图视图：把缩略图等比画到画布中央（contain，不裁剪）。 */
        function drawSrc(dataUrl) {
            const cv = $('cv'), g = cv.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
            if (!dataUrl) {
                g.fillStyle = '#999'; g.font = '16px sans-serif'; g.textAlign = 'center';
                g.fillText('本条结果未存原图缩略图（旧数据）', cv.width / 2, cv.height / 2);
                return;
            }
            const im = new Image();
            im.onload = () => {
                const k = Math.min(cv.width / im.width, cv.height / im.height);
                const w = im.width * k, h = im.height * k;
                g.drawImage(im, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
            };
            im.src = dataUrl;
        }

        function show(r) {
            if (view === 'src') drawSrc(srcUrl || r.thumb || srcThumb); // 本会话选过图 ⇒ 原文件直显；历史条目只有缩略图
            else if (view === 'solved') drawBoard(r.levelDraft?.pattern || r.pattern); // mis=none 无 levelDraft，用顶层 pattern
            else drawBoard(r.misplaced?.length ? r.misplaced : r.pattern);
            const rp = r.report || {};
            const df = rp.difficulty;
            $('stats').textContent =
                `${r.cols}×${r.rows}｜可填 ${rp.fillable ?? '?'}｜用色 ${r.colors}｜错位 ${r.misMode === 'full' ? '全错位（每颗可填珠都不就位）' : r.misMode === 'none' ? '不错位（实物图纸模式）' : `${r.swaps * 2} 颗（${r.swaps} 对交换）`}\n` +
                `色差 ${rp.colorError?.final ?? '?'}｜同色相邻率 ${rp.clusteringMisplaced?.adjRate ?? (df ? df.adjRate : '?')}` +
                (df ? (df.error
                    ? `\n难度 ——（${df.error}）`
                    : `\n难度 D${df.score}（真引擎实测 ${df.taps} 次点击｜错位 ${df.misplaced} 颗）｜预估清关 ${df.timeEst}s（公式 v0.2 = taps × ${df.secPerTap}s，§5）` +
                      (df.blockers?.length ? `\n⛔ 不可入关：${df.blockers.join('；')}` : ''))
                    : '');
            $('dl').disabled = $('cp').disabled = !(r.levelDraft);
            // 入关只在本地仓模式可用（服务端无 games/ 目录则 501）；不可入关条目直接置灰
            $('ing').disabled = !(r.levelDraft) || r.importable === false;
            // 不可入关就显式标红 + 说原因（静默换色比报错难查，不能只靠用户自己避坑）。
            // 实物图纸模式（mis=none）下这些全是游戏导入门槛，对图纸用途一条都不适用
            // （色板 artkal-s 对图纸反而正解）⇒ 降为 ℹ 提示，不吓人（2026-09-21 用户拍板）。
            const isPaper = r.misMode === 'none';
            $('badge').textContent = r.importable === false
                ? (isPaper ? 'ℹ 游戏入关限制（实物图纸不受影响）：' : '⚠ 不可入关：') + (r.blockers || []).join('；')
                : '';
        }

        /** 三视图切换（原图 / 正解 / 错位）。 */
        const TABS = { tSrc: 'src', tSolved: 'solved', tMis: 'mis' };
        for (const [btn, v] of Object.entries(TABS)) {
            $(btn).onclick = () => {
                view = v;
                for (const b of Object.keys(TABS)) $(b).className = b === btn ? 'on' : '';
                if (current) show(current);
                else if (v === 'src') drawSrc(srcUrl || srcThumb);
            };
        }

        $('dl').onclick = () => {
            const blob = new Blob([JSON.stringify(current.levelDraft, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `beads-${current.id}.json`; a.click();
        };
        $('cp').onclick = () => navigator.clipboard.writeText((current.levelDraft?.pattern || []).join('\n'))
            .then(() => msg('rowstrings 已复制', 'ok'));

        $('ing').onclick = () => {
            $('ing').disabled = true;
            fetch(`/api/results/${current.id}/ingest`, { method: 'POST' })
                .then(async (res) => {
                    const j = await res.json();
                    if (!res.ok) throw new Error(j.error || res.status);
                    msg(`已入关 ${j.ingested}（${j.kind}${j.file ? ' → ' + j.file : ''}）· 实测 ${j.time}s；levels:sync + 镜像已跑，git diff 确认后提交`, 'ok');
                })
                .catch((e) => msg('入关失败：' + e.message, 'err'))
                .finally(() => { $('ing').disabled = false; });
        };

        async function loadResults() {
            try {
                const { results } = await (await fetch('/api/results')).json();
                const byBoard = {};
                for (const r of results) (byBoard[r.board] ??= []).push(r);
                const el = $('results');
                el.innerHTML = '<b>已存结果</b> <small>（GET /api/results，小游戏在线导入同源）</small>';
                for (const [board, list] of Object.entries(byBoard)) {
                    const grp = document.createElement('div'); grp.className = 'grp';
                    grp.innerHTML = `<h3>${board}（${list.length}）</h3>`;
                    for (const r of list) {
                        const d = document.createElement('div'); d.className = 'item';
                        const noImp = r.importable === false;
                        d.innerHTML = `<span>${noImp ? (r.misMode === 'none' ? 'ℹ ' : '⚠ ') : ''}${r.id}</span><small>${r.colors} 色 · ${r.misMode === 'full' ? '全错位' : r.misMode === 'none' ? '不错位' : '错位 ' + r.swaps * 2}${noImp ? (r.misMode === 'none' ? ' · 游戏不入关' : ' · 不可入关') : ''}</small>`;
                        // 列表是轻投影（不含 pattern/缩略图）⇒ 点开才拉单条全量
                        d.onclick = async () => {
                            try {
                                const full = await (await fetch('/api/results/' + r.id)).json();
                                current = full; show(full);
                            } catch { msg('取详情失败：' + r.id, 'err'); }
                        };
                        grp.appendChild(d);
                        // 删除钮：不可逆（磁盘唯一副本）⇒ 必须二次确认；stopPropagation 避免误触发“查看该条”。
                        const x = document.createElement('button');
                        x.className = 'del'; x.textContent = '✕'; x.title = '删除这条结果（不可恢复）';
                        x.onclick = async (ev) => {
                            ev.stopPropagation();
                            if (!confirm(`删除 ${r.id}？\n磁盘上只有一份，不可恢复。`)) return;
                            try {
                                const res = await fetch('/api/results/' + r.id, { method: 'DELETE' });
                                if (!res.ok) {
                                    const j = await res.json().catch(() => ({}));
                                    return msg('删除失败：' + (j.error || res.status), 'err');
                                }
                                if (current && current.id === r.id) { current = null; $('cv').getContext('2d').clearRect(0, 0, 420, 420); }
                                msg('已删除 ' + r.id, 'ok');
                                loadResults();
                            } catch (e) { msg('删除失败：' + e.message, 'err'); }
                        };
                        d.appendChild(x);
                    }
                    el.appendChild(grp);
                }
            } catch { /* 列表失败不阻塞主流程 */ }
        }
        loadResults();
    </script>
</body>

</html>
