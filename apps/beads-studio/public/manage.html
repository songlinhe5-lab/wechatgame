<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>beads-studio · 大关/小关管理</title>
    <style>
        :root {
            --bd: #d8d2c4;
            --bg: #faf7f0;
            --ac: #3d7bf5;
            --tx: #33333d;
            --danger: #c0392b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--tx);
        }

        /* 左右 padding 跟随 main 的 1100px 居中列，宽屏下标题不再悬在内容列外。 */
        header {
            padding: 12px max(20px, calc((100% - 1100px) / 2 + 20px));
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        h1 { font-size: 16px; margin: 0; }
        a { color: var(--ac); }

        main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }

        .card {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .chhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
        .chhead code { background: #f3efe6; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
        .chhead small { color: #6b6b6b; }

        label { display: block; margin: 8px 0 2px; font-size: 12px; color: #666; }

        input, select {
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            font: inherit;
            background: #fff;
        }

        input[type="checkbox"] { width: auto; }

        button {
            padding: 5px 10px;
            border: 0;
            border-radius: 6px;
            background: var(--ac);
            color: #fff;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        button:disabled { opacity: .45; cursor: default; }
        button.ghost { background: #eee; color: var(--tx); }
        button.danger { background: var(--danger); }
        button.big { padding: 9px 14px; font-size: 14px; width: 100%; margin-top: 10px; }

        .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
        .bar .grow { flex: 1; min-width: 160px; }
        .bar .grow select, .bar .grow input { width: 100%; }

        .levels { margin-top: 10px; border-top: 1px dashed var(--bd); padding-top: 4px; }

        .lv {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            padding: 5px 0; border-bottom: 1px solid #f1ede4;
        }

        .lv:last-child { border-bottom: 0; }
        .lv.boss { background: #fdf6e8; border-radius: 6px; }
        .lv .uid { font-family: ui-monospace, monospace; font-size: 12px; color: #666; }
        .lv .id { font-weight: 600; min-width: 34px; }
        .lv small { color: #6b6b6b; }
        .lv .ops { margin-left: auto; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .lv .ops select { font-size: 12px; padding: 3px 6px; }

        #err {
            white-space: pre-wrap;
            word-break: break-all;
            background: #fdecea;
            border: 1px solid #f5c6c0;
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            display: none;
            font-family: ui-monospace, monospace;
            font-size: 12px;
        }

        /* 成功日志吸顶：底部表单/最后一行操作后也能看到反馈；空则完全不占位。 */
        #log {
            color: #1e7d3c; font-size: 13px; margin-bottom: 8px;
            position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0;
        }
        #log:empty { display: none; }

        /* 行内图案缩略图：canvas 像素尺寸 = 格数，CSS 限幅保持比例（不拉伸）。 */
        .lv canvas { max-width: 36px; max-height: 36px; flex: none; border-radius: 4px; background: #faf7f0; image-rendering: pixelated; }

        /* 选图器：缩略图网格 + 搜索/筛选；img 走 loading="lazy"，只有可视区才拉图。 */
        #picker { position: fixed; inset: 0; z-index: 30; padding: 20px; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; }
        #picker[hidden] { display: none; }
        .pk-box { background: #fff; border-radius: 12px; width: min(960px, 100%); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
        .pk-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--bd); }
        .pk-head .grow { flex: 1; }
        .pk-tools { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #f1ede4; flex-wrap: wrap; }
        .pk-tools input[type="search"] { flex: 1; min-width: 160px; }
        .pk-tools label { margin: 0; font-size: 12px; color: #444; white-space: nowrap; }
        .pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 12px 14px; overflow: auto; flex: 1; }
        .pk-item { margin: 0; padding: 6px; text-align: left; background: #fff; border: 2px solid transparent; border-radius: 8px; color: var(--tx); }
        .pk-item:hover { border-color: #b9cdf8; }
        .pk-item.on { border-color: var(--ac); background: #f3f7ff; }
        .pk-item.off { opacity: .45; cursor: not-allowed; }
        .pk-item.off:hover { border-color: transparent; }
        .pk-item .why { font-size: 10.5px; color: var(--danger); line-height: 1.35; margin-top: 2px; }
        .pk-item img { width: 100%; height: 88px; object-fit: cover; border-radius: 5px; background: #f3efe6; display: block; }
        .pk-art { height: 88px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: #f3efe6; overflow: hidden; }
        .pk-art canvas { max-width: 100%; max-height: 88px; image-rendering: pixelated; }
        .pk-item .id { font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.3; word-break: break-all; margin-top: 4px; }
        .pk-item .meta { font-size: 11px; color: #6b6b6b; }
        .pk-foot { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--bd); }
        .pk-foot .grow { flex: 1; font-size: 12px; color: #6b6b6b; }

        .row3 { display: grid; grid-template-columns: minmax(180px, .9fr) minmax(180px, .9fr) minmax(240px, 1.2fr); gap: 10px; }
        .row3 input, .row3 select { width: 100%; min-width: 0; }
        #new-prev { margin-top: 6px; font-size: 12px; color: #6b6b6b; min-height: 16px; }
        @media (max-width: 760px) { .row3 { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <header>
        <h1>大关 / 小关管理</h1>
        <a href="/" style="text-decoration:none">← 返回生成页</a>
        <span id="meta" style="color:#6b6b6b;font-size:12px"></span>
        <span style="margin-left:auto"></span>
        <button class="ghost" id="verify" title="跑 levels:sync + framework:sync（幂等，只校验不改内容）">校验并同步</button>
    </header>
    <main>
        <div style="font-size:12px;color:#6b6b6b;margin-bottom:10px">
            关号 #N = 全局装配顺序（增删后自动连续重排）· 槽 = 该关在展示墙占的格数 ·
            开放 = 自第 1 章起连续解锁 · boss 恒为章末且不可直接删除 · plate = 多格组合图（整章导入产物）
        </div>
        <div id="err"></div>
        <div id="log"></div>
        <button id="cancel" hidden style="position:fixed;right:24px;bottom:24px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.18)">取消导入</button>
        <div id="chapters"></div>

        <div class="card">
            <b>新建大关（含首关 boss，从结果导入）</b>
            <div class="row3">
                <div><label>章 id（小写字母/数字/连字符）</label><input id="new-id" placeholder="neon"></div>
                <div><label>标题（橱窗/木牌展示名）</label><input id="new-title" placeholder="霓虹"></div>
                <div><label>首关 boss（≤32 的可入关结果）</label>
                    <button class="ghost" id="new-pick" style="width:100%">选首关 boss…</button></div>
            </div>
            <label>展示图（浏览器内自动缩到 256×256 PNG）</label>
            <input type="file" id="new-img" accept="image/png,image/jpeg">
            <div id="new-prev"></div>
            <button class="big" id="new-go">新建大关</button>
        </div>
    </main>
    <div id="picker" hidden>
        <div class="pk-box">
            <div class="pk-head"><b id="pk-title">选择结果</b><span class="grow"></span><button class="ghost" id="pk-close">关闭</button></div>
            <div class="pk-tools">
                <input type="search" id="pk-q" placeholder="搜索 id / 盘面档位…">
                <label><input type="checkbox" id="pk-small"> 只看单盘 ≤32（可入关）</label>
                <span id="pk-count" style="font-size:12px;color:#6b6b6b"></span>
            </div>
            <div class="pk-grid" id="pk-grid"></div>
            <div class="pk-foot"><span class="grow" id="pk-pick">未选择</span><button id="pk-ok" disabled>确认</button></div>
        </div>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        let S = null;
        let results = [];
        let importCtl = null; // 批量导入进行中的 AbortController（「取消导入」用）
        const preselect = new URLSearchParams(location.search).get('result') || '';

        function showErr(msg) {
            $('err').textContent = msg;
            $('err').style.display = 'block';
            $('log').textContent = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showLog(lines) {
            $('err').style.display = 'none';
            $('log').textContent = Array.isArray(lines) ? lines.join('；') : String(lines || 'ok');
        }

        function btn(label, disabled, onClick, cls) {
            const b = document.createElement('button');
            b.textContent = label;
            if (cls) b.className = cls;
            b.disabled = !!disabled;
            b.onclick = onClick;
            return b;
        }

        /** 透明占位：boss 行少「设 boss / 删除」两格，占住宽度才能与普通行逐列对齐。 */
        function spacer(label) {
            const b = btn(label, true, () => {}, 'ghost');
            b.style.visibility = 'hidden';
            return b;
        }

        function select(options, value, onChange) {
            const s = document.createElement('select');
            s.innerHTML = options.map((o) => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
            if (value !== undefined) s.value = value;
            if (onChange) s.onchange = () => onChange(s.value);
            return s;
        }

        /** 统一写操作：POST → 成功刷新（服务端 log 常含断言/变更摘要），失败整段红字转达。 */
        async function op(path, body) {
            try {
                const res = await fetch(path, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(body ?? {}),
                });
                const j = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
                showLog([...(j.log || []), `关数 ${j.count}（DEMO_LEVEL_COUNT 已联动）`]);
                await reload();
            } catch (e) {
                showErr(e.message);
            }
        }

        /** 批量导入（流式回显）：服务端按 NDJSON 逐条报告测量进度，避免大图连测时页面像卡死。
         *  落盘仍是服务端同一事务；失败时红字转达（真源已回滚）。
         *  右下角「取消导入」= AbortController 断开：服务端在条目间停（服务端侧已在测的那条会跑完）。 */
        async function importBatch(chapterId, ids) {
            if (importCtl) return; // 同时只跑一个批量导入
            const ac = new AbortController();
            importCtl = ac;
            $('cancel').hidden = false;
            showLog([`批量导入：共 ${ids.length} 条，开始预检…`]);
            try {
                const res = await fetch(`/api/manage/chapter/${chapterId}/import`, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ resultIds: ids, stream: true }),
                    signal: ac.signal,
                });
                if (!(res.headers.get('content-type') || '').includes('application/x-ndjson')) {
                    const j = await res.json().catch(() => ({}));
                    throw new Error(j.error || ('HTTP ' + res.status));
                }
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let buf = '', final = null;
                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const lines = buf.split('\n');
                    buf = lines.pop();
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        const e = JSON.parse(line);
                        if (e.done) { final = e; continue; }
                        if (e.phase === 'measure') showLog([`批量导入 ${e.i}/${e.n}：正在实测 ${e.id} …`]);
                        else if (e.phase === 'cell') showLog([`批量导入 ${e.i}/${e.n}：${e.id} 正在逐格实测 第 ${e.k}/${e.m} 格 …`]);
                        else if (e.phase === 'measured') showLog([`批量导入 ${e.i}/${e.n}：${e.id} 实测完成 ✅`]);
                        else if (e.phase === 'commit') showLog([`批量导入：${e.n}/${e.n} 条实测完成，开始写盘并同步…`]);
                        // 每条让出主线程：同一 chunk 里的多条进度才不会被浏览器合成一帧（人眼看不到中间态）
                        await new Promise((r) => setTimeout(r, 0));
                    }
                }
                if (!final) throw new Error('连接中断，未收到最终结果（请刷新页面核对真源）');
                if (final.code !== 200) throw new Error(final.error || ('HTTP ' + final.code));
                showLog([...(final.log || []), `关数 ${final.count}（DEMO_LEVEL_COUNT 已联动）`]);
                await reload();
            } catch (e) {
                if (e.name === 'AbortError')
                    showErr('已取消导入：后续条目不再测量；若已进入写盘阶段，服务端会跑完本次事务（刷新页面核对）');
                else showErr(e.message);
            } finally {
                importCtl = null;
                $('cancel').hidden = true;
            }
        }

        async function reload() {
            try {
                const [stRes, rsRes] = await Promise.all([fetch('/api/manage/state'), fetch('/api/results')]);
                const st = await stRes.json();
                if (!stRes.ok) throw new Error(st.error || ('HTTP ' + stRes.status));
                S = st;
                const rs = await rsRes.json().catch(() => ({ results: [] }));
                // 全量保留（含不可入关的）：由各入口 filter 决定可见性——批量导入故意展示灰卡+原因（告知为什么不行）
                results = rs.results || [];
                render();
            } catch (e) {
                showErr('加载失败：' + e.message);
            }
        }

        /** 展示图：等比 cover 裁切到 256²（不依赖任何库）。 */
        function shrinkTo256(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    try {
                        const cv = document.createElement('canvas');
                        cv.width = cv.height = 256;
                        const ctx = cv.getContext('2d');
                        const s = Math.max(256 / img.width, 256 / img.height);
                        const w = img.width * s, h = img.height * s;
                        ctx.drawImage(img, (256 - w) / 2, (256 - h) / 2, w, h);
                        resolve(cv.toDataURL('image/png'));
                    } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
                img.src = url;
            });
        }

        /** 把关卡 pattern 画成缩略图：1 格 = 1px，CSS 限幅放大后保持像素风。 */
        function paintThumb(paint) {
            const cv = document.createElement('canvas');
            cv.width = Math.max(...paint.pattern.map((l) => l.length));
            cv.height = paint.pattern.length;
            const ctx = cv.getContext('2d');
            paint.pattern.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    const ch = row[x];
                    if (ch === '.' || ch === 'x') continue;
                    const hex = paint.colors[Number(ch) - 1];
                    if (!hex) continue;
                    ctx.fillStyle = hex;
                    ctx.fillRect(x, y, 1, 1);
                }
            });
            return cv;
        }

        // ── 选图器：缩略图网格（img 走 loading="lazy"，只有可视区才拉 /api/results/:id/thumb）──
        //    默认单选（替换图案/选 boss）；opts.multiple 时多选，确认返回**勾选顺序**的 id 数组。
        //    opts.slotsLeft（仅多选）：目标章剩余槽数，卡片标占槽数、已选合计超限时禁确认。
        let pkResolve = null, pkFilter = () => true, pkValue = '', pkMulti = false, pkPicked = [], pkSlotsLeft = Infinity;

        function pickResult(title, filter, opts = {}) {
            return new Promise((resolve) => {
                pkResolve = resolve;
                pkFilter = filter || (() => true);
                pkValue = '';
                pkMulti = !!opts.multiple;
                pkPicked = [];
                pkSlotsLeft = opts.slotsLeft ?? Infinity;
                $('pk-title').textContent = title;
                $('pk-q').value = '';
                $('pk-small').checked = false;
                $('pk-ok').disabled = true;
                $('pk-pick').textContent = '未选择';
                renderPicker();
                $('picker').hidden = false;
                $('pk-q').focus();
                // 从生成页带来的 ?result= 自动预选（仅当它仍在当前候选里）
                const hit = preselect && [...$('pk-grid').children].find((c) => c.dataset.id === preselect);
                if (hit) hit.click();
            });
        }

        function closePicker(value) {
            $('picker').hidden = true;
            const r = pkResolve;
            pkResolve = null;
            if (r) r(value || null);
        }

        function renderPicker() {
            const q = $('pk-q').value.trim().toLowerCase();
            const onlySmall = $('pk-small').checked;
            const list = results.filter((r) => pkFilter(r) && (!onlySmall || (r.cols <= 32 && r.rows <= 32)) &&
                (!q || r.id.toLowerCase().includes(q) || String(r.board || '').toLowerCase().includes(q)));
            $('pk-count').textContent = `${list.length} 条`;
            const grid = $('pk-grid');
            grid.innerHTML = '';
            for (const r of list) {
                const bad = r.importable === false; // 不可入关：灰显 + 禁点 + 原因（避免勾到最后被预检拒）
                const b = document.createElement('button');
                b.className = 'pk-item' + (bad ? ' off' : '');
                b.dataset.id = r.id;
                b.disabled = bad;
                if (pkPicked.includes(r.id)) b.classList.add('on'); // 多选：搜索/筛选重绘后保留已勾选态
                if (r.hasThumb) {
                    b.innerHTML = `<img loading="lazy" src="/api/results/${encodeURIComponent(r.id)}/thumb" alt="">`;
                } else {
                    // 旧条目没存原图缩略图：拉拼豆图案自己画（只拉缺图的那 88 条）
                    const art = document.createElement('div');
                    art.className = 'pk-art';
                    b.appendChild(art);
                    fetch(`/api/results/${encodeURIComponent(r.id)}/paint`).then((x) => (x.ok ? x.json() : null))
                        .then((p) => { if (p && art.isConnected) art.appendChild(paintThumb(p)); }).catch(() => {});
                }
                const info = document.createElement('div');
                info.innerHTML = `<div class="id">${esc(r.id)}</div><div class="meta">${r.cols}×${r.rows} · ${r.colors} 色` +
                    `${r.slots > 1 ? ` · 占 ${r.slots} 槽` : ''}</div>` +
                    (bad ? `<div class="why">不可入关：${esc(r.blockers?.[0] || '判据未通过')}${r.blockerCount > 1 ? `（共 ${r.blockerCount} 条）` : ''}</div>` : '');
                b.appendChild(info);
                b.onclick = () => {
                    if (pkMulti) {
                        const i = pkPicked.indexOf(r.id);
                        if (i >= 0) pkPicked.splice(i, 1); else pkPicked.push(r.id);
                        b.classList.toggle('on', i < 0);
                        // 合计占槽：选之前就知道放不放得下（超出时锁确认，取消勾选即恢复）
                        const total = pkPicked.reduce((n, id) => n + (results.find((x) => x.id === id)?.slots ?? 1), 0);
                        const over = total > pkSlotsLeft;
                        $('pk-ok').disabled = pkPicked.length === 0 || over;
                        $('pk-pick').textContent = pkPicked.length
                            ? `已选 ${pkPicked.length} 张 · 合计 ${total} 槽${pkSlotsLeft !== Infinity ? ` / 剩 ${pkSlotsLeft} 槽${over ? '（超出，请减选）' : ''}` : ''}：${pkPicked.join('、')}`
                            : '未选择';
                        return;
                    }
                    pkValue = r.id;
                    for (const el of grid.children) el.classList.toggle('on', el.dataset.id === r.id);
                    $('pk-ok').disabled = false;
                    $('pk-pick').textContent = `已选 ${r.id}（${r.cols}×${r.rows} · ${r.colors} 色）`;
                };
                b.ondblclick = () => { if (!pkMulti) { pkValue = r.id; closePicker(r.id); } }; // 双击直达（仅单选）
                grid.appendChild(b);
            }
        }

        $('pk-q').oninput = renderPicker;
        $('pk-small').onchange = renderPicker;
        $('pk-ok').onclick = () => {
            if (pkMulti) { if (pkPicked.length) closePicker([...pkPicked]); }
            else if (pkValue) closePicker(pkValue);
        };
        $('pk-close').onclick = () => closePicker(null);
        $('picker').onclick = (e) => { if (e.target === $('picker')) closePicker(null); };
        addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('picker').hidden) closePicker(null); });

        function render() {
            if (!S) return;
            $('meta').textContent = `contentVersion ${S.contentVersion} · 关数 ${S.count} / DEMO_LEVEL_COUNT ${S.demoLevelCount} · 章容量 ${S.wallCapacity} 槽`;

            // ── 大关列表 ──
            const root = $('chapters');
            root.innerHTML = '';
            S.chapters.forEach((ch, ci) => {
                const card = document.createElement('div');
                card.className = 'card';

                const head = document.createElement('div');
                head.className = 'chhead';
                head.innerHTML = `<b>#${ch.order} ${esc(ch.title)}</b><code>${esc(ch.id)}</code>` +
                    `<small>${ch.levels.length} 关 · ${ch.slots}/${S.wallCapacity} 槽 · 展示图 ${esc(ch.showcase?.art || '—')}</small>`;
                card.appendChild(head);

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.appendChild(btn('↑', ci === 0, () => op(`/api/manage/chapter/${ch.id}/move`, { dir: 'up' }), 'ghost'));
                bar.appendChild(btn('↓', ci === S.chapters.length - 1, () => op(`/api/manage/chapter/${ch.id}/move`, { dir: 'down' }), 'ghost'));
                bar.appendChild(btn('改名', false, () => {
                    const t = prompt('大关标题（1–40 字）', ch.title);
                    if (t !== null) op(`/api/manage/chapter/${ch.id}/rename`, { title: t });
                }, 'ghost'));

                const openWrap = document.createElement('label');
                openWrap.style.cssText = 'margin:0;display:flex;gap:5px;align-items:center;font-size:12px;color:#666';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = !!ch.open;
                cb.onchange = () => op(`/api/manage/chapter/${ch.id}/open`, { open: cb.checked });
                openWrap.append(cb, document.createTextNode('开放（须自第 1 章起连续）'));
                bar.appendChild(openWrap);

                // 删章：并入所选章 / 级联删除整章
                const others = S.chapters.filter((c) => c.id !== ch.id);
                if (others.length) {
                    const sel = select(others.map((c) => ({ value: c.id, label: `并入 ${c.title}（${c.id}）` })));
                    bar.appendChild(sel);
                    bar.appendChild(btn('并入', false, () => {
                        if (!confirm(`把「${ch.title}」全部 ${ch.levels.length} 关并入 ${sel.value}（boss 前，原 boss 降级）？`)) return;
                        op(`/api/manage/chapter/${ch.id}/delete`, { action: 'move', moveTo: sel.value });
                    }, 'ghost'));
                }
                bar.appendChild(btn('删整章', false, () => {
                    if (!confirm(`删除大关「${ch.title}」及其全部 ${ch.levels.length} 关文件？\n关号会自动重编号；展示图保留为 archive。不可撤销。`)) return;
                    op(`/api/manage/chapter/${ch.id}/delete`, { action: 'delete' });
                }, 'danger'));
                card.appendChild(bar);

                // ── 小关列表（展示轴 = 本章 levels[] 顺序）──
                const lvBox = document.createElement('div');
                lvBox.className = 'levels';
                const last = ch.levels.length - 1;
                ch.levels.forEach((lv, li) => {
                    const row = document.createElement('div');
                    row.className = 'lv' + (lv.kind === 'boss' ? ' boss' : '');
                    if (lv.missing) {
                        row.innerHTML = `<span class="uid">${esc(lv.uid)}</span><small style="color:var(--danger)">⚠ manifest 引用缺失（先跑校验）</small>`;
                        lvBox.appendChild(row);
                        return;
                    }
                    row.innerHTML = `<span class="uid">${esc(lv.uid)}</span>` +
                        `<span class="id">#${lv.id}${lv.idEnd !== undefined && lv.idEnd !== lv.id ? '–' + lv.idEnd : ''}</span>` +
                        `<span>${esc(lv.name || '(未命名)')}</span>` +
                        `<small>${esc(lv.kind)} · ${lv.cols}×${lv.rows}${lv.time !== undefined ? ' · ' + lv.time + 's' : ''} · ${lv.slots} 槽</small>`;
                    if (lv.paint) row.prepend(paintThumb(lv.paint)); // 当前图案缩略图（plate 无 pattern ⇒ 不画）

                    const ops = document.createElement('div');
                    ops.className = 'ops';
                    const isBoss = lv.kind === 'boss';
                    ops.appendChild(btn('↑', isBoss || li === 0, () => op(`/api/manage/level/${lv.uid}/move`, { dir: 'up' }), 'ghost'));
                    ops.appendChild(btn('↓', isBoss || li >= last - 1, () => op(`/api/manage/level/${lv.uid}/move`, { dir: 'down' }), 'ghost'));
                    ops.appendChild(btn('改名', false, () => {
                        const n = prompt('小关名（1–60 字）', lv.name || '');
                        if (n !== null) op(`/api/manage/level/${lv.uid}/rename`, { name: n });
                    }, 'ghost'));
                    if (!isBoss && lv.kind !== 'plate') {
                        ops.appendChild(btn('设 boss', false, () => {
                            if (!confirm(`把 ${lv.uid} 设为本章 boss？（需换到末位，原 boss 降为普通关）`)) return;
                            op(`/api/manage/level/${lv.uid}/boss`);
                        }, 'ghost'));
                    } else {
                        ops.appendChild(spacer('设 boss'));
                    }
                    if (lv.kind !== 'plate') {
                        // 替换图案：换 levelDraft 不动 uid/关号/章位/关名；plate 是多文件产物，须删后重导。
                        ops.appendChild(btn('替换图案…', false, async () => {
                            const v = await pickResult(`替换 ${lv.uid} 的图案`, (r) => r.importable !== false);
                            if (!v) return;
                            if (!confirm(`用「${v}」替换 ${lv.uid} 的图案？关名/关号/章位不变，时长按实测重算。`)) return;
                            op(`/api/manage/level/${lv.uid}/replace`, { resultId: v });
                        }, 'ghost'));
                    }
                    if (others.length && !isBoss) {
                        const mv = select([{ value: '', label: '移章…' }, ...others.map((c) => ({ value: c.id, label: `→ ${c.title}` }))], '', (v) => {
                            if (v) op(`/api/manage/level/${lv.uid}/move`, { chapter: v });
                        });
                        ops.appendChild(mv);
                    }
                    if (!isBoss) {
                        ops.appendChild(btn('删除', false, () => {
                            if (!confirm(`删除小关 ${lv.uid}（${lv.file}）？其后关号自动前移，不可撤销。`)) return;
                            op(`/api/manage/level/${lv.uid}/remove`);
                        }, 'danger'));
                    } else {
                        ops.appendChild(spacer('删除'));
                    }
                    row.appendChild(ops);
                    lvBox.appendChild(row);
                });
                card.appendChild(lvBox);

                // ── 分大关导入：选一条或多条结果（弹缩略图选择器）→ 按勾选顺序插本关 boss 前 ──
                const imp = document.createElement('div');
                imp.className = 'bar';
                const tip = document.createElement('span');
                tip.style.cssText = 'font-size:12px;color:#6b6b6b';
                tip.textContent = '分大关导入：';
                imp.appendChild(tip);
                imp.appendChild(btn('批量导入…', false, async () => {
                    const ids = await pickResult(`导入到「${ch.title}」（boss 前，可多选）`, null, {
                        multiple: true, slotsLeft: Math.max(0, S.wallCapacity - ch.slots),
                    });
                    if (!ids || !ids.length) return;
                    importBatch(ch.id, ids);
                }));
                card.appendChild(imp);

                root.appendChild(card);
            });
            if (!S.chapters.length) root.innerHTML = '<div class="card">暂无大关（先新建）</div>';
        }

        $('verify').onclick = async () => {
            try {
                const res = await fetch('/api/manage/verify', { method: 'POST' });
                const j = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
                showLog(j.note || 'ok');
                await reload();
            } catch (e) {
                showErr(e.message);
            }
        };

        // 取消导入：断开连接即可，服务端在下一个条目开始前停（正在测的那条会跑完）
        $('cancel').onclick = () => {
            if (!importCtl) return;
            importCtl.abort();
            showLog(['正在取消…（当前这条测完就停，不写盘）']);
        };

        // 新建大关的首关 boss：走同一个缩略图选择器（只列单盘 ≤32）
        let newBossResult = '';
        $('new-pick').onclick = async () => {
            const v = await pickResult('选首关 boss（单盘 ≤32）', (r) => r.importable !== false && r.cols <= 32 && r.rows <= 32);
            if (!v) return;
            newBossResult = v;
            const r = results.find((x) => x.id === v) || {};
            $('new-pick').textContent = `已选 ${v}（${r.cols}×${r.rows}）`;
        };

        // 展示图预览：选文件时算一次缩到 256²，提交直接复用（省一次解码）。
        let coverDataUrl = '';
        $('new-img').onchange = async () => {
            coverDataUrl = '';
            $('new-prev').textContent = '';
            const file = $('new-img').files[0];
            if (!file) return;
            try {
                coverDataUrl = await shrinkTo256(file);
                $('new-prev').innerHTML = `<img src="${coverDataUrl}" alt="展示图预览" style="width:72px;height:72px;border-radius:6px;vertical-align:middle;border:1px solid var(--bd)"> 已缩到 256×256`;
            } catch (e) {
                $('new-prev').textContent = '图片解码失败：' + e.message;
            }
        };

        $('new-go').onclick = async () => {
            const id = $('new-id').value.trim();
            const title = $('new-title').value.trim();
            const resultId = newBossResult;
            const file = $('new-img').files[0];
            if (!id || !title || !resultId) return showErr('章 id / 标题 / 首关 boss 结果 三项必填');
            if (!file) return showErr('请选择展示图（PNG/JPEG，浏览器内缩到 256²）');
            try {
                const imageDataUrl = coverDataUrl || await shrinkTo256(file);
                await op('/api/manage/chapter', { id, title, resultId, imageDataUrl });
                $('new-id').value = $('new-title').value = '';
                $('new-img').value = '';
                coverDataUrl = '';
                newBossResult = '';
                $('new-pick').textContent = '选首关 boss…';
                $('new-prev').textContent = '';
            } catch (e) {
                showErr(e.message);
            }
        };

        reload();
    </script>
</body>

</html>
